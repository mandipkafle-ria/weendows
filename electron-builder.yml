appId: com.yourname.homelayer
productName: HomeLayer
# koffi 3.x loads its native addon from the @koromix/koffi-* optional package.
# Both paths must stay outside the asar archive in packaged builds.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
  - resources/cursors/**
# The media backend is spawned from disk, so ship it as a plain resource.
extraResources:
  - from: node_modules/windows-media-sessions/bin/win-x64/windows-media-sessions-backend.exe
    to: media/windows-media-sessions-backend.exe
files:
  - '!node_modules/windows-media-sessions/bin/**'
win:
  target: [nsis, portable]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
