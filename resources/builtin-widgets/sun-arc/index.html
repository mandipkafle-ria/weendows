<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sun arc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <link rel="stylesheet" href="widget://_builtins/env/extras.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .card.w {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .sun--arc {
      display: grid;
      gap: 10px;
      align-content: center;
    }
    .sun__svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .sun__fill { fill: color-mix(in srgb, var(--accent) 10%, transparent); }
    .sun__track {
      fill: none;
      stroke: var(--muted);
      opacity: .45;
      stroke-width: 2;
      stroke-dasharray: 1.5 5;
      stroke-linecap: round;
    }
    .sun__prog {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 0 100;
      filter: drop-shadow(0 0 6px var(--glow));
    }
    .sun__horizon { stroke: var(--border); stroke-width: 1.5; }
    .sun__dot {
      fill: #ffc24a;
      filter: drop-shadow(0 0 9px rgba(255, 194, 74, .95));
    }
    .sun.is-night .sun__dot {
      fill: var(--muted);
      filter: none;
      opacity: .6;
    }
    .sun__foot {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 8px;
    }
    .sun__foot small {
      display: block;
      margin-bottom: 6px;
      font: 600 9.5px/1 var(--font-mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sun__foot b {
      font: 700 15px/1 var(--font-sans);
      white-space: nowrap;
    }
    .sun__foot div:last-child { text-align: right; }
    .sun__status {
      text-align: center;
      font: 500 11px/1.35 var(--font-mono);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <main class="card w sun sun--arc" data-sun data-rise="06:08" data-set="17:19">
    <span class="w__label">Daylight · Kathmandu</span>
    <svg class="sun__svg" viewBox="0 0 200 118" aria-hidden="true">
      <path class="sun__fill" d="M20 100A80 80 0 0 1 180 100Z"/>
      <path class="sun__track" d="M20 100A80 80 0 0 1 180 100"/>
      <path class="sun__prog" data-sun-prog pathLength="100" d="M20 100A80 80 0 0 1 180 100"/>
      <line class="sun__horizon" x1="6" y1="100" x2="194" y2="100"/>
      <circle class="sun__dot" data-sun-dot r="7" cx="20" cy="100"/>
    </svg>
    <div class="sun__foot">
      <div><small>Sunrise</small><b data-sun-rise>6:08 AM</b></div>
      <p class="sun__status" data-sun-status></p>
      <div><small>Sunset</small><b data-sun-set>5:19 PM</b></div>
    </div>
  </main>

  <script src="widget://_builtins/env/extras.js"></script>
  <script>
    (() => {
      'use strict';

      const { $$, clamp, fmt12, dur, every, initEnv, initTheme } = window.HLW;
      initEnv('arc');
      initTheme();

      function sun() {
        $$('[data-sun]').forEach((root) => {
          const [riseHour, riseMinute] = root.dataset.rise.split(':').map(Number);
          const [setHour, setMinute] = root.dataset.set.split(':').map(Number);
          const now = new Date();
          const minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
          const rise = riseHour * 60 + riseMinute;
          const set = setHour * 60 + setMinute;
          const t = clamp((minutes - rise) / (set - rise), 0, 1);

          const dot = root.querySelector('[data-sun-dot]');
          dot.setAttribute('cx', (100 - 80 * Math.cos(Math.PI * t)).toFixed(1));
          dot.setAttribute('cy', (100 - 80 * Math.sin(Math.PI * t)).toFixed(1));
          root.querySelector('[data-sun-prog]').style.strokeDasharray = `${(t * 100).toFixed(1)} 100`;

          const night = minutes < rise || minutes > set;
          root.classList.toggle('is-night', night);

          const riseNode = root.querySelector('[data-sun-rise]');
          const setNode = root.querySelector('[data-sun-set]');
          const status = root.querySelector('[data-sun-status]');
          riseNode.textContent = fmt12(riseHour, riseMinute);
          setNode.textContent = fmt12(setHour, setMinute);
          status.textContent = minutes < rise
            ? `Sunrise in ${dur(rise - minutes)}`
            : minutes > set
              ? `Sun set ${dur(minutes - set)} ago`
              : `${dur(set - minutes)} of daylight left`;
        });
      }

      sun();
      every(sun, 30000);
    })();
  </script>
</body>
</html>
