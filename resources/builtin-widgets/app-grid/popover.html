<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' widget:; style-src 'unsafe-inline'; img-src hl-icon: data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bundle</title>
    <script src="widget://_builtins/app-grid/icons.js"></script>
    <script>
      document.documentElement.dataset.variant =
        new URLSearchParams(location.search).get('variant') || 'classic'
    </script>
    <style>
      :root {
        color-scheme: normal;
      }

      /* Monochrome in Popover - Solid Opaque */
      html[data-variant='monochrome'] .popover {
        background-color: #121215;
        background:
          radial-gradient(circle at 82% 4%, rgba(255, 255, 255, 0.08), transparent 46%),
          linear-gradient(145deg, #18181c, #0e0e11);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      }
      html[data-variant='monochrome'] .plate img {
        filter: grayscale(100%) contrast(1.2) brightness(0.95);
      }
      html[data-variant='monochrome'] .letter {
        background: #242428 !important;
        color: #f8fafc !important;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      html[data-variant='monochrome'] .title-input:focus {
        border-color: rgba(255, 255, 255, 0.6);
      }
      html[data-variant='monochrome'] .app-tile:hover {
        border-color: rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
      }

      /* Frosted Glass in Popover - Solid Opaque backing with luminous crystal borders */
      html[data-variant='glass'] .popover {
        background-color: #161e2e;
        background:
          radial-gradient(circle at 50% 0%, rgba(125, 175, 255, 0.25), transparent 60%),
          linear-gradient(145deg, #1b2438, #0f1522);
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.9),
          0 8px 24px rgba(0, 0, 0, 0.6),
          inset 0 1px 1px rgba(255, 255, 255, 0.4);
      }

      /* Cyberpunk in Popover - Solid Opaque */
      html[data-variant='cyberpunk'] .popover {
        background-color: #0d0f17;
        background:
          radial-gradient(circle at 80% 10%, rgba(0, 240, 255, 0.18), transparent 45%),
          linear-gradient(145deg, #0f121d, #07090e);
        border: 1px solid #00f0ff;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.9),
          0 0 25px rgba(0, 240, 255, 0.35);
      }
      html[data-variant='cyberpunk'] .title-input {
        color: #00f0ff;
      }
      html[data-variant='cyberpunk'] .app-tile:hover {
        border-color: #ff007f;
        box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
      }

      /* Minimal in Popover - Solid Opaque */
      html[data-variant='minimal'] .popover {
        background-color: #13151b;
        background: linear-gradient(145deg, #181a22, #0f1016);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      }

      /* Retro in Popover - Solid Opaque */
      html[data-variant='retro'] .popover {
        background-color: #f7f1e6;
        background: linear-gradient(145deg, #fbf7ef, #ede4d3);
        border: 2px solid #2d261e;
        color: #2d261e;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          4px 4px 0 #2d261e;
      }
      html[data-variant='retro'] .title-input {
        color: #2d261e;
      }
      html[data-variant='retro'] .count {
        color: rgba(45, 38, 30, 0.6);
      }
      html[data-variant='retro'] .label {
        color: #2d261e;
      }
      html[data-variant='retro'] .app-tile:hover {
        background: rgba(45, 38, 30, 0.08);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .popover {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 9px 11px 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 20px;
        background-color: #181d2a;
        background:
          radial-gradient(circle at 82% 4%, rgba(150, 130, 255, 0.15), transparent 46%),
          linear-gradient(145deg, #1d2334, #10131d);
        background-clip: padding-box;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.85),
          0 4px 14px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        animation: pop-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .header {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 36px;
        padding: 0 2px 4px;
      }

      .title-input {
        box-sizing: border-box;
        min-width: 0;
        flex: 1;
        padding: 4px 5px;
        border: 1px solid transparent;
        border-radius: 7px;
        outline: 0;
        background: transparent;
        color: #f0f5ff;
        font-family: 'DotGothic16', 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        text-overflow: ellipsis;
      }

      .title-input:hover {
        border-color: rgba(255, 255, 255, 0.12);
      }

      .title-input:focus {
        border-color: rgba(151, 190, 255, 0.65);
        background: rgba(255, 255, 255, 0.05);
      }

      .count {
        flex: none;
        color: rgba(205, 224, 255, 0.46);
        font-size: 9px;
      }

      .apps {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        align-content: start;
        min-height: 0;
        padding: 2px;
        overflow-y: auto;
        scrollbar-color: rgba(220, 235, 255, 0.24) transparent;
        scrollbar-width: thin;
      }

      .app-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 0;
        height: 74px;
        padding: 3px 2px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        color: #eaf2ff;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        transition:
          background 120ms ease,
          border-color 120ms ease,
          transform 120ms ease;
      }

      .app-tile:hover {
        border-color: rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.05);
      }

      .app-tile:focus-visible {
        outline: 2px solid rgba(151, 190, 255, 0.8);
        outline-offset: 1px;
      }

      .app-tile.dragging {
        opacity: 0.3;
      }

      .app-tile.drop-target {
        border-color: rgba(151, 190, 255, 0.55);
        background: rgba(125, 175, 255, 0.12);
      }

      .plate {
        position: relative;
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 11px;
        color: #ffffff;
        transition: transform 240ms cubic-bezier(0.22, 1.2, 0.36, 1);
      }

      .plate[data-kind='art'] {
        background: transparent;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.34));
      }

      .plate[data-kind='art'] img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        object-fit: contain;
      }

      .plate[data-kind='glyph'] {
        overflow: hidden;
        background:
          radial-gradient(120% 85% at 30% 0%, rgba(255, 255, 255, 0.34), transparent 58%),
          linear-gradient(150deg, var(--tile-a, #6d9bff), var(--tile-b, #1b46c9));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          inset 0 -12px 16px -10px rgba(0, 0, 0, 0.55),
          0 5px 12px -5px rgba(0, 0, 0, 0.6);
      }

      .plate[data-kind='glyph']::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), transparent 46%);
        pointer-events: none;
      }

      .plate[data-kind='glyph'] svg {
        position: relative;
        z-index: 1;
        display: block;
        width: 21px;
        height: 21px;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
      }

      .app-tile:hover .plate {
        transform: translateY(-1px);
      }

      .label {
        width: 100%;
        overflow: hidden;
        color: rgba(233, 242, 255, 0.9);
        font-size: 9px;
        line-height: 1.2;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .drag-ghost {
        position: fixed;
        z-index: 10;
        width: 64px;
        height: 74px;
        opacity: 0.9;
        pointer-events: none;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
        transform: translate(-50%, -50%) scale(1.05);
      }

      .context-menu {
        position: fixed;
        z-index: 20;
        min-width: 132px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        background: rgba(18, 23, 35, 0.98);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      }

      .context-menu[hidden] {
        display: none;
      }

      .context-menu button {
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #ffd7cf;
        cursor: pointer;
        font-size: 10px;
        text-align: left;
      }

      .context-menu button:hover {
        background: rgba(255, 157, 138, 0.12);
      }

      .toast {
        position: absolute;
        right: 10px;
        bottom: 8px;
        left: 10px;
        padding: 7px 8px;
        border: 1px solid rgba(255, 157, 138, 0.3);
        border-radius: 8px;
        background: rgba(42, 22, 22, 0.97);
        color: #ffd7cf;
        font-size: 9px;
        line-height: 1.35;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      }

      .toast[hidden] {
        display: none;
      }

      .error {
        margin: auto;
        padding: 12px;
        color: #ffb4a4;
        font-size: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <section class="popover">
      <header class="header">
        <input
          class="title-input"
          id="title"
          type="text"
          maxlength="24"
          readonly
          aria-label="Bundle name"
        />
        <span class="count" id="count"></span>
      </header>
      <div class="apps" id="apps"></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </section>
    <div class="context-menu" id="context-menu" hidden>
      <button id="remove-app" type="button">Remove from bundle</button>
    </div>
    <script>
      ;(function () {
        'use strict'

        var DRAG_THRESHOLD = 8
        var title = document.getElementById('title')
        var count = document.getElementById('count')
        var appsNode = document.getElementById('apps')
        var toast = document.getElementById('toast')
        var menu = document.getElementById('context-menu')
        var removeButton = document.getElementById('remove-app')
        var state = null
        var toastTimer = null
        var menuAppId = null
        var drag = null
        var suppressClick = false
        var renameValue = ''

        // Shared with the app grid: real icon first, then a brand or category
        // glyph from icons.js, never a lone letter.
        var FALLBACK_SVG =
          '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>'

        function paintAppIcon(node, app) {
          var name = app && app.name ? app.name : ''
          if (app && app.iconUrl) {
            node.dataset.kind = 'art'
            var image = document.createElement('img')
            image.alt = ''
            image.decoding = 'async'
            image.draggable = false
            image.src = app.iconUrl
            image.addEventListener('error', function () {
              if (image.parentNode === node) {
                node.removeChild(image)
              }
              paintAppIcon(node, { name: name })
            })
            node.appendChild(image)
            return node
          }
          var kit = window.HLIcons
          var palette = kit ? kit.palette(name) : { a: '#6d9bff', b: '#1b46c9' }
          node.dataset.kind = 'glyph'
          node.style.setProperty('--tile-a', palette.a)
          node.style.setProperty('--tile-b', palette.b)
          node.innerHTML = kit ? kit.glyph(name, 21) : FALLBACK_SVG
          return node
        }

        function showToast(message) {
          if (toastTimer) {
            clearTimeout(toastTimer)
          }
          toast.textContent = message
          toast.hidden = false
          toastTimer = setTimeout(function () {
            toast.hidden = true
          }, 5000)
        }

        function hideMenu() {
          menu.hidden = true
          menuAppId = null
        }

        function showMenu(appId, x, y) {
          menuAppId = appId
          menu.hidden = false
          var width = menu.offsetWidth || 140
          var height = menu.offsetHeight || 34
          menu.style.left = Math.min(x, window.innerWidth - width - 4) + 'px'
          menu.style.top = Math.min(y, window.innerHeight - height - 4) + 'px'
        }

        function tile(app, index) {
          var node = document.createElement('button')
          node.type = 'button'
          node.className = 'app-tile'
          node.dataset.appId = app.id
          node.dataset.index = String(index)
          node.setAttribute('aria-label', app.name)
          node.title = app.name

          var plate = document.createElement('span')
          plate.className = 'plate'
          paintAppIcon(plate, app)

          var label = document.createElement('span')
          label.className = 'label'
          label.textContent = app.name

          node.appendChild(plate)
          node.appendChild(label)
          return node
        }

        function render() {
          if (!state) {
            return
          }
          title.value = state.bundle.name
          count.textContent = state.bundle.apps.length + ' apps'
          appsNode.replaceChildren()
          for (var index = 0; index < state.bundle.apps.length; index += 1) {
            appsNode.appendChild(tile(state.bundle.apps[index], index))
          }
        }

        function apply(next) {
          if (!next) {
            window.bundleApi.close()
            return
          }
          state = next
          render()
        }

        function refresh() {
          return window.bundleApi
            .getState()
            .then(apply)
            .catch(function (error) {
              showToast((error && error.message) || 'Could not load the bundle.')
            })
        }

        function commitRename() {
          if (!state || title.readOnly) {
            return
          }
          var name = title.value.trim().slice(0, 24)
          title.readOnly = true
          if (!name || name === state.bundle.name) {
            title.value = state.bundle.name
            return
          }
          window.bundleApi
            .rename(name)
            .then(function (result) {
              apply(result.state)
            })
            .catch(function (error) {
              title.value = state.bundle.name
              showToast((error && error.message) || 'Could not rename the bundle.')
            })
        }

        function cancelRename() {
          title.readOnly = true
          title.value = state ? state.bundle.name : ''
        }

        function launch(appId) {
          window.bundleApi
            .launch(appId)
            .then(function () {
              window.bundleApi.close()
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not launch the app.')
            })
        }

        function removeApp(appId) {
          hideMenu()
          window.bundleApi
            .removeApp(appId)
            .then(function (result) {
              if (result.state) {
                apply(result.state)
              }
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not remove the app.')
            })
        }

        function updateDrag(event) {
          if (!drag) {
            return
          }
          var dx = event.clientX - drag.startX
          var dy = event.clientY - drag.startY
          if (!drag.active && Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) {
            return
          }
          if (!drag.active) {
            drag.active = true
            suppressClick = true
            drag.tile.classList.add('dragging')
            drag.ghost = drag.tile.cloneNode(true)
            drag.ghost.className = 'app-tile drag-ghost'
            drag.ghost.removeAttribute('data-index')
            document.body.appendChild(drag.ghost)
          }

          drag.ghost.style.left = event.clientX + 'px'
          drag.ghost.style.top = event.clientY + 'px'

          var element = document.elementFromPoint(event.clientX, event.clientY)
          var target = element ? element.closest('.app-tile') : null
          if (drag.target && drag.target !== target) {
            drag.target.classList.remove('drop-target')
          }
          drag.target = target && target !== drag.tile ? target : null
          if (drag.target) {
            drag.target.classList.add('drop-target')
          }
        }

        function finishDrag(event) {
          if (!drag) {
            return
          }
          var current = drag
          drag = null
          if (current.ghost) {
            current.ghost.remove()
          }
          current.tile.classList.remove('dragging')
          if (current.target) {
            current.target.classList.remove('drop-target')
          }
          if (!current.active) {
            return
          }

          var element = document.elementFromPoint(event.clientX, event.clientY)
          var target = element ? element.closest('.app-tile') : null
          var to = target ? Number(target.dataset.index) : state.bundle.apps.length - 1
          if (!Number.isInteger(to) || to === current.index) {
            return
          }
          window.bundleApi
            .reorder(current.index, to)
            .then(function (result) {
              if (result.state) {
                apply(result.state)
              }
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not reorder the bundle.')
            })
        }

        title.addEventListener('click', function () {
          if (title.readOnly) {
            renameValue = title.value
            title.readOnly = false
            title.focus()
            title.select()
          }
        })
        title.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault()
            commitRename()
          } else if (event.key === 'Escape') {
            event.preventDefault()
            cancelRename()
          }
        })
        title.addEventListener('blur', commitRename)

        appsNode.addEventListener('click', function (event) {
          if (suppressClick) {
            suppressClick = false
            return
          }
          var node = event.target.closest('.app-tile')
          if (node && node.dataset.appId) {
            launch(node.dataset.appId)
          }
        })

        appsNode.addEventListener('contextmenu', function (event) {
          var node = event.target.closest('.app-tile')
          if (!node || !node.dataset.appId) {
            return
          }
          event.preventDefault()
          showMenu(node.dataset.appId, event.clientX, event.clientY)
        })

        appsNode.addEventListener('dragstart', function (event) {
          event.preventDefault()
        })
        appsNode.addEventListener('pointerdown', function (event) {
          if (event.button !== 0) {
            return
          }
          var node = event.target.closest('.app-tile')
          if (!node) {
            return
          }
          suppressClick = false
          drag = {
            tile: node,
            index: Number(node.dataset.index),
            startX: event.clientX,
            startY: event.clientY,
            active: false,
            ghost: null,
            target: null
          }
          try {
            node.setPointerCapture(event.pointerId)
          } catch {
            // Pointer capture is best-effort.
          }
        })
        appsNode.addEventListener('pointermove', updateDrag)
        appsNode.addEventListener('pointerup', finishDrag)
        appsNode.addEventListener('pointercancel', function () {
          if (drag && drag.ghost) {
            drag.ghost.remove()
          }
          if (drag) {
            drag.tile.classList.remove('dragging')
          }
          drag = null
        })

        removeButton.addEventListener('click', function () {
          if (menuAppId) {
            removeApp(menuAppId)
          }
        })

        document.addEventListener('click', function (event) {
          if (!menu.hidden && !menu.contains(event.target)) {
            hideMenu()
          }
        })

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            if (!menu.hidden) {
              hideMenu()
            } else if (!title.readOnly) {
              cancelRename()
            } else {
              window.bundleApi.close()
            }
          }
        })

        if (!window.bundleApi) {
          appsNode.innerHTML = '<p class="error">The bundle popover needs its bridge.</p>'
          return
        }

        window.addEventListener('blur', hideMenu)
        window.bundleApi.onState(apply)
        refresh()
      })()
    </script>
  </body>
</html>
