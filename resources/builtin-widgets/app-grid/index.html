    <script>
      ;(function () {
        'use strict'

        var TILE_WIDTH = 80
        var TILE_GAP = 12
        var DRAG_THRESHOLD = 8
        var MERGE_HOVER_MS = 500

        var grid = document.getElementById('grid')
        var empty = document.getElementById('empty')
        var titleInput = document.getElementById('title-input')
        var statusNode = document.getElementById('status')
        var refreshButton = document.getElementById('refresh')
        var addButton = document.getElementById('add')
        var picker = document.getElementById('picker')
        var pickerList = document.getElementById('picker-list')
        var pickerClose = document.getElementById('picker-close')
        var pickerCancel = document.getElementById('picker-cancel')
        var pickerAdd = document.getElementById('picker-add')
        var searchInput = document.getElementById('search')
        var showHiddenInput = document.getElementById('show-hidden')
        var toast = document.getElementById('toast')
        var toastText = document.getElementById('toast-text')
        var toastAction = document.getElementById('toast-action')

        var createFolderBtn = document.getElementById('create-folder-btn')
        var styleBtn = document.getElementById('style-btn')
        var folderModal = document.getElementById('folder-modal')
        var folderClose = document.getElementById('folder-close')
        var folderCancel = document.getElementById('folder-cancel')
        var folderCreate = document.getElementById('folder-create')
        var folderNameInput = document.getElementById('folder-name-input')
        var folderSearch = document.getElementById('folder-search')
        var folderPickerList = document.getElementById('folder-picker-list')
        var folderSelectedCount = document.getElementById('folder-selected-count')
        var styleDrawer = document.getElementById('style-drawer')
        var styleClose = document.getElementById('style-close')
        var themeChips = document.getElementById('theme-chips')
        var folderChips = document.getElementById('folder-chips')
        var shapeChips = document.getElementById('shape-chips')
        var toggleHideLabels = document.getElementById('toggle-hide-labels')
        var tileContextMenu = document.getElementById('tile-context-menu')
        var menuLaunchApp = document.getElementById('menu-launch-app')
        var menuCreateFolder = document.getElementById('menu-create-folder')
        var menuRemoveTile = document.getElementById('menu-remove-tile')

        var folderSelected = new Set()
        var folderModalOpen = false
        var styleDrawerOpen = false
        var contextTarget = null
        var userPrefs = {
          theme: document.documentElement.dataset.variant || 'classic',
          folderStyle: 'grid',
          iconShape: 'squircle',
          hideLabels: false
        }

        var state = { widgetId: '', title: 'Apps', apps: [], items: [] }
        var titleSaving = false
        var selected = new Set()
        var activeIndex = 0
        var toastTimer = null
        var pickerOpen = false
        var refreshBusy = false
        var drag = null
        var hoverTarget = null
        var mergeTimer = null
        var mergeTargetKey = null
        var suppressClick = false

        function setStatus(text) {
          if (statusNode) {
            statusNode.textContent = text
          }
        }

        function applyTitle(title) {
          state.title = typeof title === 'string' && title.trim() ? title.trim() : 'Apps'
          if (document.activeElement !== titleInput) {
            titleInput.value = state.title
          }
        }

        function saveTitle() {
          if (titleSaving) {
            return
          }
          var next = titleInput.value.trim().slice(0, 32)
          if (!next) {
            titleInput.value = state.title
            return
          }
          if (next === state.title) {
            titleInput.value = next
            return
          }
          titleSaving = true
          window.hl.grid
            .renameTitle(next)
            .then(function (result) {
              applyState(result)
              setStatus('Title saved')
            })
            .catch(function (error) {
              titleInput.value = state.title
              showError(error && error.message ? error.message : 'Could not rename the app grid.')
            })
            .then(function () {
              titleSaving = false
            })
        }

        function iconName(app) {
          return app && app.name ? app.name : ''
        }

        // Used only if icons.js did not load: a neutral 2x2 app mark.
        var FALLBACK_GLYPH =
          '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>'

        // Paint an app icon into any square container: tile plate, folder mini or
        // picker row. A cached Windows icon wins; without one we draw a brand or
        // category glyph from icons.js on a tinted plate, never a letter.
        function paintAppIcon(node, app, mini) {
          var name = iconName(app)
          if (app && app.iconUrl) {
            node.dataset.kind = 'art'
            var image = document.createElement('img')
            image.alt = ''
            image.decoding = 'async'
            image.draggable = false
            image.src = app.iconUrl
            image.addEventListener('error', function () {
              if (image.parentNode === node) {
                node.removeChild(image)
              }
              paintAppIcon(node, { name: name }, mini)
            })
            node.appendChild(image)
            return node
          }
          var kit = window.HLIcons
          var palette = kit ? kit.palette(name) : { a: '#6d9bff', b: '#1b46c9' }
          node.dataset.kind = 'glyph'
          if (palette.brand) {
            node.dataset.brand = palette.brand
          } else {
            delete node.dataset.brand
          }
          node.style.setProperty('--tile-a', palette.a)
          node.style.setProperty('--tile-b', palette.b)
          node.innerHTML = kit ? kit.glyph(name, mini ? 13 : 24) : FALLBACK_GLYPH
          return node
        }

        function makePlate(app) {
          var plate = document.createElement('span')
          plate.className = 'plate'
          return paintAppIcon(plate, app, false)
        }

        function makeMini(app, className) {
          var node = document.createElement('span')
          node.className = className || 'bundle-mini'
          return paintAppIcon(node, app, true)
        }

        function bundlePlate(bundle) {
          var folderStyle = document.documentElement.dataset.folderStyle || 'grid'
          var plate = document.createElement('span')
          plate.className = 'bundle-plate style-' + folderStyle

          if (folderStyle === 'stack') {
            var count = Math.min(3, bundle.apps.length)
            for (var sIdx = 0; sIdx < count; sIdx += 1) {
              plate.appendChild(makeMini(bundle.apps[sIdx], 'bundle-stack-item stack-' + sIdx))
            }
            return plate
          }

          if (folderStyle === 'badge') {
            if (bundle.apps[0]) {
              plate.appendChild(makeMini(bundle.apps[0], 'bundle-badge-art'))
            }
            if (bundle.apps.length > 1) {
              var pill = document.createElement('span')
              pill.className = 'bundle-count-pill'
              pill.textContent = '+' + (bundle.apps.length - 1)
              plate.appendChild(pill)
            }
            return plate
          }

          if (folderStyle === 'sheet') {
            var tab = document.createElement('span')
            tab.className = 'bundle-sheet-tab'
            tab.textContent = String(bundle.apps.length)
            plate.appendChild(tab)

            var sheetRow = document.createElement('span')
            sheetRow.className = 'bundle-sheet-row'
            var sheetCount = Math.min(3, bundle.apps.length)
            for (var shIdx = 0; shIdx < sheetCount; shIdx += 1) {
              sheetRow.appendChild(makeMini(bundle.apps[shIdx], 'bundle-mini'))
            }
            plate.appendChild(sheetRow)
            return plate
          }

          // Default: 2x2 grid
          for (var index = 0; index < 4; index += 1) {
            var app = bundle.apps[index]
            if (app) {
              plate.appendChild(makeMini(app, 'bundle-mini'))
            } else {
              var blank = document.createElement('span')
              blank.className = 'bundle-mini'
              plate.appendChild(blank)
            }
          }
          return plate
        }

        function tileLabel(text) {
          var label = document.createElement('span')
          label.className = 'label'
          label.textContent = text
          return label
        }

        function makeTile(item, index) {
          var tile = document.createElement('button')
          tile.type = 'button'
          tile.className = 'tile'
          tile.dataset.key = item.key
          tile.dataset.index = String(index)
          tile.setAttribute('role', 'gridcell')
          tile.tabIndex = index === activeIndex ? 0 : -1

          if (item.type === 'app') {
            tile.dataset.appId = item.app.id
            tile.setAttribute('aria-label', item.app.name)
            tile.title = item.app.name
            var icon = document.createElement('span')
            icon.className = 'tile-icon'
            icon.appendChild(makePlate(item.app))
            tile.appendChild(icon)
            tile.appendChild(tileLabel(item.app.name))
          } else {
            tile.dataset.bundleId = item.bundle.id
            tile.setAttribute(
              'aria-label',
              item.bundle.name + ', ' + item.bundle.apps.length + ' apps'
            )
            tile.title = item.bundle.name
            var bundleIcon = document.createElement('span')
            bundleIcon.className = 'tile-icon'
            bundleIcon.appendChild(bundlePlate(item.bundle))
            tile.appendChild(bundleIcon)
            tile.appendChild(tileLabel(item.bundle.name))
          }

          return tile
        }

        function renderGrid() {
          var previous = new Map()
          Array.prototype.forEach.call(grid.querySelectorAll('.tile'), function (tile) {
            previous.set(tile.dataset.key, tile.getBoundingClientRect())
          })

          grid.replaceChildren()
          empty.hidden = state.items.length > 0
          if (state.items.length === 0) {
            grid.hidden = true
            setStatus(state.apps.length ? 'Add apps to get started' : 'No apps found')
            return
          }
          grid.hidden = false

          if (activeIndex >= state.items.length) {
            activeIndex = Math.max(0, state.items.length - 1)
          }
          for (var index = 0; index < state.items.length; index += 1) {
            grid.appendChild(makeTile(state.items[index], index))
          }

          var tiles = grid.querySelectorAll('.tile')
          Array.prototype.forEach.call(tiles, function (tile, index) {
            var before = previous.get(tile.dataset.key)
            if (!before) {
              return
            }
            var after = tile.getBoundingClientRect()
            var dx = before.left - after.left
            var dy = before.top - after.top
            if (dx === 0 && dy === 0) {
              return
            }
            tile.style.transition = 'none'
            tile.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)'
            requestAnimationFrame(function () {
              tile.style.transition = 'transform 120ms ease'
              tile.style.transform = ''
            })
          })

          setStatus(
            state.apps.length
              ? state.apps.length + ' installed app' + (state.apps.length === 1 ? '' : 's')
              : 'No apps found'
          )
          focusActive(false)
        }

        function focusActive(scroll) {
          var tiles = grid.querySelectorAll('.tile')
          Array.prototype.forEach.call(tiles, function (tile, index) {
            tile.tabIndex = index === activeIndex ? 0 : -1
          })
          var active = tiles[activeIndex]
          if (active && scroll) {
            active.focus()
            active.scrollIntoView({ block: 'nearest', inline: 'nearest' })
          }
        }

        function applyState(next) {
          if (!next || !Array.isArray(next.items) || !Array.isArray(next.apps)) {
            return
          }
          state = next
          applyTitle(next.title)
          renderGrid()
          if (pickerOpen) {
            renderPicker()
          }
          if (folderModalOpen) {
            renderFolderPicker()
          }
        }

        function refreshState() {
          return window.hl.grid
            .getState()
            .then(function (next) {
              applyState(next)
              return next
            })
            .catch(function (error) {
              showError(error && error.message ? error.message : 'Could not load apps.')
            })
        }

        function showError(message) {
          setStatus(message)
        }

        function hideToast() {
          toast.hidden = true
          toastAction.hidden = true
          toastAction.onclick = null
          if (toastTimer) {
            clearTimeout(toastTimer)
            toastTimer = null
          }
        }

        function showToast(message, actionLabel, action) {
          hideToast()
          toastText.textContent = message
          if (actionLabel && action) {
            toastAction.textContent = actionLabel
            toastAction.hidden = false
            toastAction.onclick = function () {
              hideToast()
              action()
            }
          }
          toast.hidden = false
          toastTimer = setTimeout(hideToast, 6000)
        }

        function launchApp(appId) {
          window.hl.launch.app(appId).catch(function (error) {
            var message =
              error && error.code === 'not_found'
                ? 'That app is no longer available.'
                : (error && error.message) || 'Could not launch the app.'
            showToast(message, 'Remove from grid', function () {
              window.hl.grid
                .removeApp(appId)
                .then(applyState)
                .catch(function (removeError) {
                  showError(
                    removeError && removeError.message
                      ? removeError.message
                      : 'Could not remove the app.'
                  )
                })
            })
          })
        }

        function openBundle(bundleId, tile) {
          var rect = tile.getBoundingClientRect()
          window.hl.grid
            .openBundle(bundleId, {
              x: rect.left,
              y: rect.top,
              width: rect.width,
              height: rect.height,
              variant: document.documentElement.dataset.variant || 'classic'
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not open the bundle.')
            })
        }

        function activateTile(index) {
          var item = state.items[index]
          if (!item) {
            return
          }
          var tile = grid.querySelector('[data-index="' + index + '"]')
          if (item.type === 'app') {
            launchApp(item.app.id)
          } else if (tile) {
            openBundle(item.bundle.id, tile)
          }
        }

        function appsOnGrid() {
          var present = new Set()
          for (var index = 0; index < state.items.length; index += 1) {
            var item = state.items[index]
            if (item.type === 'app') {
              present.add(item.app.id)
            } else {
              for (var appIndex = 0; appIndex < item.bundle.apps.length; appIndex += 1) {
                present.add(item.bundle.apps[appIndex].id)
              }
            }
          }
          return present
        }

        function renderPicker() {
          var query = searchInput ? searchInput.value.trim().toLowerCase() : ''
          var showHidden = Boolean(showHiddenInput && showHiddenInput.checked)
          var present = appsOnGrid()
          var apps = state.apps
            .filter(function (app) {
              if (app.hidden && !showHidden) {
                return false
              }
              return !query || app.name.toLowerCase().indexOf(query) >= 0
            })
            .slice()
            .sort(function (left, right) {
              return left.name.localeCompare(right.name, undefined, { sensitivity: 'base' })
            })

          pickerList.replaceChildren()
          if (apps.length === 0) {
            var emptyNode = document.createElement('p')
            emptyNode.className = 'empty'
            emptyNode.textContent = query ? 'No apps match that search.' : 'No apps found.'
            pickerList.appendChild(emptyNode)
          }

          for (var index = 0; index < apps.length; index += 1) {
            var app = apps[index]
            var onGrid = present.has(app.id)
            var row = document.createElement('label')
            row.className = 'picker-row' + (onGrid ? ' disabled' : '')

            var checkbox = document.createElement('input')
            checkbox.type = 'checkbox'
            checkbox.checked = onGrid || selected.has(app.id)
            checkbox.disabled = onGrid
            checkbox.addEventListener(
              'change',
              (function (appId, node) {
                return function () {
                  if (node.checked) {
                    selected.add(appId)
                  } else {
                    selected.delete(appId)
                  }
                  updatePickerAdd()
                }
              })(app.id, checkbox)
            )

            var icon = document.createElement('span')
            icon.className = 'picker-icon'
            paintAppIcon(icon, app, true)

            var name = document.createElement('span')
            name.className = 'picker-name'
            name.textContent = app.name + (onGrid ? ' · added' : '')

            row.appendChild(checkbox)
            row.appendChild(icon)
            row.appendChild(name)
            pickerList.appendChild(row)
          }

          updatePickerAdd()
        }

        function updatePickerAdd() {
          pickerAdd.disabled = selected.size === 0
          pickerAdd.textContent = selected.size ? 'Add (' + selected.size + ')' : 'Add'
        }

        function openPicker() {
          closeStyleDrawer()
          closeFolderModal()
          hideContextMenu()
          selected.clear()
          pickerOpen = true
          picker.hidden = false
          if (searchInput) {
            searchInput.value = ''
            searchInput.focus()
          }
          renderPicker()
        }

        function closePicker() {
          pickerOpen = false
          picker.hidden = true
          selected.clear()
          var tiles = grid.querySelectorAll('.tile')
          if (tiles[activeIndex]) {
            tiles[activeIndex].focus()
          }
        }

        function addSelected() {
          var appIds = Array.from(selected)
          if (appIds.length === 0) {
            return
          }
          pickerAdd.disabled = true
          window.hl.grid
            .addApps(appIds)
            .then(function (next) {
              applyState(next)
              closePicker()
            })
            .catch(function (error) {
              updatePickerAdd()
              showToast((error && error.message) || 'Could not add the apps.')
            })
        }

        function applyPrefs(prefs) {
          if (!prefs) return
          if (prefs.theme) {
            userPrefs.theme = prefs.theme
            document.documentElement.dataset.variant = prefs.theme
          }
          if (prefs.folderStyle) {
            userPrefs.folderStyle = prefs.folderStyle
            document.documentElement.dataset.folderStyle = prefs.folderStyle
          }
          if (prefs.iconShape) {
            userPrefs.iconShape = prefs.iconShape
            document.documentElement.dataset.iconShape = prefs.iconShape
          }
          if (typeof prefs.hideLabels === 'boolean') {
            userPrefs.hideLabels = prefs.hideLabels
            document.documentElement.dataset.hideLabels = prefs.hideLabels ? 'true' : 'false'
          }
          updateStyleChips()
          renderGrid()
        }

        function savePrefs() {
          if (window.hl && window.hl.storage) {
            window.hl.storage.set('app_grid_prefs', userPrefs).catch(function () {})
          }
        }

        function updateStyleChips() {
          if (themeChips) {
            var tBtns = themeChips.querySelectorAll('.drawer-chip')
            Array.prototype.forEach.call(tBtns, function (btn) {
              var on = btn.dataset.themeVal === userPrefs.theme
              btn.classList.toggle('active', on)
              btn.setAttribute('aria-checked', on ? 'true' : 'false')
            })
          }
          if (folderChips) {
            var fBtns = folderChips.querySelectorAll('.drawer-chip')
            Array.prototype.forEach.call(fBtns, function (btn) {
              var on = btn.dataset.folderVal === userPrefs.folderStyle
              btn.classList.toggle('active', on)
              btn.setAttribute('aria-checked', on ? 'true' : 'false')
            })
          }
          if (shapeChips) {
            var sBtns = shapeChips.querySelectorAll('.drawer-chip')
            Array.prototype.forEach.call(sBtns, function (btn) {
              var on = btn.dataset.shapeVal === userPrefs.iconShape
              btn.classList.toggle('active', on)
              btn.setAttribute('aria-checked', on ? 'true' : 'false')
            })
          }
          if (toggleHideLabels) {
            toggleHideLabels.checked = Boolean(userPrefs.hideLabels)
          }
        }

        function openStyleDrawer() {
          closePicker()
          closeFolderModal()
          hideContextMenu()
          styleDrawerOpen = true
          if (styleDrawer) styleDrawer.hidden = false
          updateStyleChips()
        }

        function closeStyleDrawer() {
          styleDrawerOpen = false
          if (styleDrawer) styleDrawer.hidden = true
        }

        function openFolderModal(preselectedAppId) {
          closePicker()
          closeStyleDrawer()
          hideContextMenu()
          folderSelected.clear()
          if (preselectedAppId) {
            folderSelected.add(preselectedAppId)
          }
          if (folderNameInput) folderNameInput.value = ''
          if (folderSearch) folderSearch.value = ''
          folderModalOpen = true
          if (folderModal) folderModal.hidden = false
          renderFolderPicker()
          if (folderNameInput) folderNameInput.focus()
        }

        function closeFolderModal() {
          folderModalOpen = false
          if (folderModal) folderModal.hidden = true
          folderSelected.clear()
        }

        function updateFolderCreateBtn() {
          if (!folderCreate || !folderNameInput || !folderSelectedCount) return
          var name = folderNameInput.value.trim()
          var count = folderSelected.size
          folderSelectedCount.textContent = count + ' selected'
          folderCreate.disabled = !name || count === 0
        }

        function renderFolderPicker() {
          if (!folderPickerList) return
          var query = folderSearch ? folderSearch.value.trim().toLowerCase() : ''
          var apps = state.apps
            .filter(function (app) {
              return !query || app.name.toLowerCase().indexOf(query) >= 0
            })
            .slice()
            .sort(function (a, b) {
              return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })
            })

          folderPickerList.replaceChildren()
          if (apps.length === 0) {
            var emptyNode = document.createElement('p')
            emptyNode.className = 'empty'
            emptyNode.textContent = query ? 'No apps match that search.' : 'No apps found.'
            folderPickerList.appendChild(emptyNode)
          }

          for (var i = 0; i < apps.length; i += 1) {
            var app = apps[i]
            var row = document.createElement('label')
            row.className = 'picker-row'

            var checkbox = document.createElement('input')
            checkbox.type = 'checkbox'
            checkbox.checked = folderSelected.has(app.id)
            checkbox.addEventListener(
              'change',
              (function (id, node) {
                return function () {
                  if (node.checked) {
                    folderSelected.add(id)
                  } else {
                    folderSelected.delete(id)
                  }
                  updateFolderCreateBtn()
                }
              })(app.id, checkbox)
            )

            var icon = document.createElement('span')
            icon.className = 'picker-icon'
            paintAppIcon(icon, app, true)

            var nameSpan = document.createElement('span')
            nameSpan.className = 'picker-name'
            nameSpan.textContent = app.name

            row.appendChild(checkbox)
            row.appendChild(icon)
            row.appendChild(nameSpan)
            folderPickerList.appendChild(row)
          }

          updateFolderCreateBtn()
        }

        function createFolderSubmit() {
          if (!folderNameInput || !folderCreate) return
          var name = folderNameInput.value.trim().slice(0, 24)
          var appIds = Array.from(folderSelected)
          if (!name || appIds.length === 0) return
          folderCreate.disabled = true
          window.hl.grid
            .createBundle(name, appIds)
            .then(function (next) {
              applyState(next)
              closeFolderModal()
              showToast('Folder "' + name + '" created!')
            })
            .catch(function (error) {
              folderCreate.disabled = false
              showToast((error && error.message) || 'Could not create folder.')
            })
        }

        function hideContextMenu() {
          if (tileContextMenu) {
            tileContextMenu.hidden = true
          }
          contextTarget = null
        }

        function showContextMenu(event, item, tile) {
          event.preventDefault()
          event.stopPropagation()
          if (!tileContextMenu) return
          contextTarget = { item: item, tile: tile }

          if (item.type === 'app') {
            if (menuLaunchApp) menuLaunchApp.textContent = 'Launch ' + item.app.name
            if (menuCreateFolder) {
              menuCreateFolder.hidden = false
              menuCreateFolder.textContent = 'Create Folder with ' + item.app.name
            }
            if (menuRemoveTile) menuRemoveTile.textContent = 'Remove from Grid'
          } else {
            if (menuLaunchApp) menuLaunchApp.textContent = 'Open Folder: ' + item.bundle.name
            if (menuCreateFolder) menuCreateFolder.hidden = true
            if (menuRemoveTile) menuRemoveTile.textContent = 'Delete Folder'
          }

          tileContextMenu.style.left = '0px'
          tileContextMenu.style.top = '0px'
          tileContextMenu.hidden = false

          var rect = tileContextMenu.getBoundingClientRect()
          var x = Math.min(event.clientX, window.innerWidth - rect.width - 8)
          var y = Math.min(event.clientY, window.innerHeight - rect.height - 8)
          tileContextMenu.style.left = Math.max(8, x) + 'px'
          tileContextMenu.style.top = Math.max(8, y) + 'px'
        }

        function clearHover() {
          if (hoverTarget) {
            hoverTarget.classList.remove('drop-target', 'merge-target')
          }
          hoverTarget = null
          mergeTargetKey = null
          if (mergeTimer) {
            clearTimeout(mergeTimer)
            mergeTimer = null
          }
        }

        function insideMiddle(rect, x, y) {
          var nx = (x - rect.left) / rect.width
          var ny = (y - rect.top) / rect.height
          return nx >= 0.2 && nx <= 0.8 && ny >= 0.2 && ny <= 0.8
        }

        function updateDrag(event) {
          if (!drag) {
            return
          }
          var dx = event.clientX - drag.startX
          var dy = event.clientY - drag.startY
          if (!drag.active && Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) {
            return
          }

          if (!drag.active) {
            drag.active = true
            suppressClick = true
            drag.tile.classList.add('dragging')
            drag.ghost = drag.tile.cloneNode(true)
            drag.ghost.className = 'tile drag-ghost'
            drag.ghost.removeAttribute('data-index')
            document.body.appendChild(drag.ghost)
          }

          drag.ghost.style.left = event.clientX + 'px'
          drag.ghost.style.top = event.clientY + 'px'

          var element = document.elementFromPoint(event.clientX, event.clientY)
          var target = element ? element.closest('.tile') : null
          if (!target || target === drag.tile) {
            clearHover()
            return
          }

          if (target !== hoverTarget) {
            clearHover()
            hoverTarget = target
            target.classList.add('drop-target')
          }

          var inMiddle = insideMiddle(target.getBoundingClientRect(), event.clientX, event.clientY)
          if (!inMiddle) {
            target.classList.remove('merge-target')
            mergeTargetKey = null
            if (mergeTimer) {
              clearTimeout(mergeTimer)
              mergeTimer = null
            }
          } else if (!mergeTimer && !mergeTargetKey) {
            mergeTimer = setTimeout(function () {
              if (hoverTarget === target) {
                target.classList.add('merge-target')
                mergeTargetKey = target.dataset.key || null
              }
            }, MERGE_HOVER_MS)
          }
        }

        function finishDrag(event) {
          if (!drag) {
            return
          }
          var current = drag
          var sourceKey = mergeTargetKey
          drag = null
          clearHover()

          if (current.ghost) {
            current.ghost.remove()
          }
          current.tile.classList.remove('dragging')

          if (!current.active) {
            return
          }

          var targetElement = document.elementFromPoint(event.clientX, event.clientY)
          var target = targetElement ? targetElement.closest('.tile') : null
          var targetIndex = target ? Number(target.dataset.index) : state.items.length - 1
          var sourceItem = state.items[current.index]
          if (!sourceItem) {
            return
          }

          if (sourceItem.type === 'app' && sourceKey) {
            window.hl.grid
              .merge(sourceItem.app.id, sourceKey)
              .then(applyState)
              .catch(function (error) {
                showToast((error && error.message) || 'Could not create the bundle.')
              })
            return
          }

          if (!Number.isInteger(targetIndex) || targetIndex === current.index) {
            return
          }

          window.hl.grid
            .move(current.index, targetIndex)
            .then(applyState)
            .catch(function (error) {
              showToast((error && error.message) || 'Could not move the app.')
            })
        }

        grid.addEventListener('pointerdown', function (event) {
          if (event.button !== 0) {
            return
          }
          var tile = event.target.closest('.tile')
          if (!tile || pickerOpen) {
            return
          }
          activeIndex = Number(tile.dataset.index) || 0
          suppressClick = false
          drag = {
            tile: tile,
            index: activeIndex,
            startX: event.clientX,
            startY: event.clientY,
            active: false,
            ghost: null
          }
          try {
            tile.setPointerCapture(event.pointerId)
          } catch {
            // Pointer capture is best-effort.
          }
        })

        grid.addEventListener('dragstart', function (event) {
          event.preventDefault()
        })
        grid.addEventListener('pointermove', updateDrag)
        grid.addEventListener('pointerup', finishDrag)
        grid.addEventListener('pointercancel', function () {
          if (drag && drag.ghost) {
            drag.ghost.remove()
          }
          if (drag) {
            drag.tile.classList.remove('dragging')
          }
          drag = null
          clearHover()
        })

        grid.addEventListener('click', function (event) {
          hideContextMenu()
          if (suppressClick) {
            suppressClick = false
            return
          }
          var tile = event.target.closest('.tile')
          if (!tile || pickerOpen || folderModalOpen || styleDrawerOpen) {
            return
          }
          activateTile(Number(tile.dataset.index))
        })

        grid.addEventListener('contextmenu', function (event) {
          var tile = event.target.closest('.tile')
          if (!tile || pickerOpen || folderModalOpen || styleDrawerOpen) {
            return
          }
          var index = Number(tile.dataset.index)
          var item = state.items[index]
          if (item) {
            showContextMenu(event, item, tile)
          }
        })

        document.addEventListener('click', function (event) {
          if (tileContextMenu && !tileContextMenu.contains(event.target)) {
            hideContextMenu()
          }
        })

        grid.addEventListener('keydown', function (event) {
          var tiles = grid.querySelectorAll('.tile')
          if (tiles.length === 0) {
            return
          }
          var columns = Math.max(
            1,
            Math.floor((grid.clientWidth + TILE_GAP) / (TILE_WIDTH + TILE_GAP))
          )
          var next = activeIndex
          if (event.key === 'ArrowRight') {
            next += 1
          } else if (event.key === 'ArrowLeft') {
            next -= 1
          } else if (event.key === 'ArrowDown') {
            next += columns
          } else if (event.key === 'ArrowUp') {
            next -= columns
          } else if (event.key === 'Home') {
            next = 0
          } else if (event.key === 'End') {
            next = tiles.length - 1
          } else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault()
            activateTile(activeIndex)
            return
          } else {
            return
          }
          event.preventDefault()
          activeIndex = Math.min(tiles.length - 1, Math.max(0, next))
          focusActive(true)
        })

        refreshButton.addEventListener('click', function () {
          if (refreshBusy) {
            return
          }
          refreshBusy = true
          refreshButton.classList.add('busy')
          setStatus('Refreshing apps…')
          window.hl.apps
            .refresh()
            .then(function (apps) {
              state.apps = apps
              return refreshState()
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not refresh apps.')
            })
            .then(function () {
              refreshBusy = false
              refreshButton.classList.remove('busy')
            })
        })

        addButton.addEventListener('click', openPicker)
        pickerClose.addEventListener('click', closePicker)
        pickerCancel.addEventListener('click', closePicker)
        pickerAdd.addEventListener('click', addSelected)
        searchInput.addEventListener('input', renderPicker)
        showHiddenInput.addEventListener('change', renderPicker)

        if (createFolderBtn) {
          createFolderBtn.addEventListener('click', function () {
            openFolderModal()
          })
        }
        if (folderClose) folderClose.addEventListener('click', closeFolderModal)
        if (folderCancel) folderCancel.addEventListener('click', closeFolderModal)
        if (folderCreate) folderCreate.addEventListener('click', createFolderSubmit)
        if (folderNameInput) folderNameInput.addEventListener('input', updateFolderCreateBtn)
        if (folderSearch) folderSearch.addEventListener('input', renderFolderPicker)

        if (styleBtn) {
          styleBtn.addEventListener('click', function () {
            if (styleDrawerOpen) {
              closeStyleDrawer()
            } else {
              openStyleDrawer()
            }
          })
        }
        if (styleClose) styleClose.addEventListener('click', closeStyleDrawer)

        if (themeChips) {
          themeChips.addEventListener('click', function (event) {
            var chip = event.target.closest('.drawer-chip')
            if (!chip || !chip.dataset.themeVal) return
            userPrefs.theme = chip.dataset.themeVal
            document.documentElement.dataset.variant = userPrefs.theme
            updateStyleChips()
            savePrefs()
          })
        }

        if (folderChips) {
          folderChips.addEventListener('click', function (event) {
            var chip = event.target.closest('.drawer-chip')
            if (!chip || !chip.dataset.folderVal) return
            userPrefs.folderStyle = chip.dataset.folderVal
            document.documentElement.dataset.folderStyle = userPrefs.folderStyle
            updateStyleChips()
            renderGrid()
            savePrefs()
          })
        }

        if (shapeChips) {
          shapeChips.addEventListener('click', function (event) {
            var chip = event.target.closest('.drawer-chip')
            if (!chip || !chip.dataset.shapeVal) return
            userPrefs.iconShape = chip.dataset.shapeVal
            document.documentElement.dataset.iconShape = userPrefs.iconShape
            updateStyleChips()
            savePrefs()
          })
        }

        if (toggleHideLabels) {
          toggleHideLabels.addEventListener('change', function () {
            userPrefs.hideLabels = toggleHideLabels.checked
            document.documentElement.dataset.hideLabels = userPrefs.hideLabels ? 'true' : 'false'
            savePrefs()
          })
        }

        if (menuLaunchApp) {
          menuLaunchApp.addEventListener('click', function () {
            if (!contextTarget) return
            var target = contextTarget
            hideContextMenu()
            if (target.item.type === 'app') {
              launchApp(target.item.app.id)
            } else {
              openBundle(target.item.bundle.id, target.tile)
            }
          })
        }

        if (menuCreateFolder) {
          menuCreateFolder.addEventListener('click', function () {
            if (!contextTarget) return
            var target = contextTarget
            hideContextMenu()
            if (target.item.type === 'app') {
              openFolderModal(target.item.app.id)
            }
          })
        }

        if (menuRemoveTile) {
          menuRemoveTile.addEventListener('click', function () {
            if (!contextTarget) return
            var target = contextTarget
            hideContextMenu()
            if (target.item.type === 'app') {
              window.hl.grid
                .removeApp(target.item.app.id)
                .then(applyState)
                .catch(function (err) {
                  showToast((err && err.message) || 'Could not remove app.')
                })
            } else {
              window.hl.grid
                .removeBundle(target.item.bundle.id)
                .then(applyState)
                .catch(function (err) {
                  showToast((err && err.message) || 'Could not remove folder.')
                })
            }
          })
        }

        titleInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault()
            titleInput.blur()
          } else if (event.key === 'Escape') {
            event.preventDefault()
            event.stopPropagation()
            titleInput.value = state.title
            titleInput.blur()
          }
        })

        titleInput.addEventListener('blur', saveTitle)

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            if (contextTarget) {
              hideContextMenu()
            } else if (folderModalOpen) {
              closeFolderModal()
            } else if (styleDrawerOpen) {
              closeStyleDrawer()
            } else if (pickerOpen) {
              closePicker()
            }
          }
        })

        if (!window.hl || !window.hl.grid) {
          showError('The app grid needs the widget bridge.')
          return
        }

        window.hl
          .ready()
          .then(function () {
            if (window.hl.storage) {
              window.hl.storage
                .get('app_grid_prefs')
                .then(function (stored) {
                  if (stored && typeof stored === 'object') {
                    applyPrefs(stored)
                  }
                })
                .catch(function () {})
            }
            return window.hl.grid.getState()
          })
          .then(function (next) {
            applyState(next)
          })
          .catch(function (error) {
            showError(error && error.message ? error.message : 'Could not load apps.')
          })

        window.hl.onApps(function (apps) {
          if (Array.isArray(apps)) {
            state.apps = apps
            refreshState()
          }
        })

        window.hl.onEditMode(function () {
          // Edit mode is handled by the shell overlay for this widget.
        })

        function applyTheme(dark) {
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        }

        window.hl
          .getContext()
          .then(function (context) {
            applyTheme(context.dark)
          })
          .catch(function () {})

        window.hl.onTheme(function (theme) {
          applyTheme(theme.dark)
        })
      })()
    </script>
  </body>
</html>
