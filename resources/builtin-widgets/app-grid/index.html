<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apps</title>
    <script>
      document.documentElement.dataset.variant =
        new URLSearchParams(location.search).get('variant') || 'classic'
    </script>
    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('widget://_fonts/DotGothic16-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: normal;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: 'DotGothic16', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        box-sizing: border-box;
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 12px 14px 10px;
        overflow: hidden;
        border: 0;
        border-radius: 18px;
        background:
          radial-gradient(circle at 88% 8%, rgba(125, 175, 255, 0.16), transparent 48%),
          linear-gradient(145deg, rgba(19, 25, 38, 0.95), rgba(10, 13, 20, 0.94));
        background-clip: padding-box;
        box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.38),
          inset 0 0 0 1px rgba(255, 255, 255, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .header {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 32px;
        padding: 0 2px 8px;
      }

      .heading {
        min-width: 0;
      }

      .title {
        margin: 0;
        color: #eaf2ff;
        font-size: 15px;
        font-weight: 400;
      }

      .title-input {
        width: 150px;
        min-width: 0;
        margin-left: -4px;
        padding: 1px 4px;
        border: 1px solid transparent;
        border-radius: 6px;
        outline: none;
        background: transparent;
        color: inherit;
        font: inherit;
      }

      .title-input:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .title-input:focus {
        border-color: rgba(151, 190, 255, 0.36);
        background: rgba(255, 255, 255, 0.07);
      }

      .status {
        display: block;
        overflow: hidden;
        color: rgba(205, 224, 255, 0.46);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        flex: none;
        align-items: center;
        gap: 6px;
      }

      .icon-button,
      .add-button {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: #dce9ff;
        cursor: pointer;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      .icon-button {
        display: grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        font-size: 14px;
      }

      .add-button {
        padding: 6px 9px;
        font-size: 10px;
        font-weight: 600;
      }

      .icon-button:hover,
      .add-button:hover {
        border-color: rgba(125, 175, 255, 0.38);
        background: rgba(125, 175, 255, 0.14);
      }

      .icon-button:focus-visible,
      .add-button:focus-visible,
      .tile:focus-visible,
      .picker-button:focus-visible,
      .picker-row:focus-within {
        outline: 2px solid rgba(151, 190, 255, 0.8);
        outline-offset: 2px;
      }

      .icon-button.busy {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .grid[hidden] {
        display: none;
      }

      .grid {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(auto-fill, 80px);
        gap: 12px;
        align-content: start;
        justify-content: center;
        min-height: 0;
        padding: 2px;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-color: rgba(220, 235, 255, 0.24) transparent;
        scrollbar-width: thin;
      }

      .grid::-webkit-scrollbar {
        width: 6px;
      }

      .grid::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(220, 235, 255, 0.22);
      }

      .tile {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        width: 80px;
        height: 96px;
        padding: 4px;
        border: 1px solid transparent;
        border-radius: 14px;
        background: transparent;
        color: #e9f2ff;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        transition:
          background 120ms ease,
          border-color 120ms ease,
          transform 120ms ease;
      }

      .tile:hover {
        border-color: rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.05);
      }

      .tile.dragging {
        opacity: 0.32;
      }

      .tile.drop-target {
        border-color: rgba(151, 190, 255, 0.38);
        background: rgba(125, 175, 255, 0.1);
      }

      .tile.merge-target {
        border-color: rgba(190, 160, 255, 0.9);
        background: rgba(125, 95, 255, 0.2);
        box-shadow: 0 0 0 2px rgba(125, 95, 255, 0.22);
        transform: scale(1.04);
      }

      .tile-icon {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
      }

      .plate {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03)),
          rgba(255, 255, 255, 0.05);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 5px 12px rgba(0, 0, 0, 0.26);
      }

      .plate img {
        display: block;
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .letter {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 12px;
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 19px;
        font-weight: 700;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      .label {
        width: 100%;
        overflow: hidden;
        color: rgba(233, 242, 255, 0.9);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 10px;
        line-height: 1.2;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .bundle-plate {
        display: grid;
        grid-template-columns: repeat(2, 22px);
        grid-template-rows: repeat(2, 22px);
        gap: 2px;
        width: 44px;
        height: 44px;
        padding: 4px;
        place-content: center;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 5px 12px rgba(0, 0, 0, 0.24);
      }

      .bundle-mini {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        overflow: hidden;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 9px;
        font-weight: 700;
      }

      .bundle-mini img {
        display: block;
        width: 18px;
        height: 18px;
        object-fit: contain;
      }

      .empty[hidden] {
        display: none;
      }

      .empty {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px;
        color: rgba(220, 235, 255, 0.5);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        text-align: center;
      }

      .empty strong {
        color: rgba(233, 242, 255, 0.82);
        font-size: 12px;
        font-weight: 600;
      }

      .drag-ghost {
        position: fixed;
        z-index: 20;
        width: 80px;
        height: 96px;
        opacity: 0.9;
        pointer-events: none;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.4));
        transform: translate(-50%, -50%) scale(1.04);
      }

      .picker {
        position: absolute;
        z-index: 30;
        inset: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(13, 18, 28, 0.98);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }

      .picker[hidden] {
        display: none;
      }

      .picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .picker-title {
        margin: 0;
        color: #eaf2ff;
        font-size: 13px;
        font-weight: 400;
      }

      .search {
        box-sizing: border-box;
        width: 100%;
        padding: 7px 9px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        outline: 0;
        background: rgba(255, 255, 255, 0.05);
        color: #eef5ff;
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
      }

      .search:focus {
        border-color: rgba(125, 175, 255, 0.55);
      }

      .picker-list {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .picker-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 8px;
        color: rgba(233, 242, 255, 0.88);
        cursor: pointer;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
      }

      .picker-row:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .picker-row.disabled {
        cursor: default;
        opacity: 0.4;
      }

      .picker-row input {
        flex: none;
        accent-color: #7da9ff;
      }

      .picker-icon {
        display: grid;
        flex: none;
        width: 22px;
        height: 22px;
        place-items: center;
        overflow: hidden;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 9px;
        font-weight: 700;
      }

      .picker-icon img {
        width: 18px;
        height: 18px;
        object-fit: contain;
      }

      .picker-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .picker-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .hidden-toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        color: rgba(205, 224, 255, 0.58);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 9px;
        cursor: pointer;
      }

      .picker-actions {
        display: flex;
        gap: 6px;
      }

      .picker-button {
        padding: 6px 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: #dce9ff;
        cursor: pointer;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
      }

      .picker-button.primary {
        border-color: rgba(125, 175, 255, 0.4);
        background: rgba(125, 175, 255, 0.18);
      }

      .picker-button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .toast {
        position: absolute;
        z-index: 40;
        right: 10px;
        bottom: 10px;
        left: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 9px;
        border: 1px solid rgba(255, 157, 138, 0.3);
        border-radius: 10px;
        background: rgba(42, 22, 22, 0.96);
        color: #ffd7cf;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 10px;
        line-height: 1.35;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
      }

      .toast[hidden] {
        display: none;
      }

      .toast-text {
        flex: 1;
        min-width: 0;
      }

      .toast button {
        flex: none;
        padding: 4px 7px;
        border: 1px solid rgba(255, 157, 138, 0.35);
        border-radius: 6px;
        background: rgba(255, 157, 138, 0.1);
        color: #ffd7cf;
        cursor: pointer;
        font-size: 9px;
      }

      .error {
        margin: auto;
        color: #ffb4a4;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
      }

      html[data-theme='light'] .card {
        background:
          radial-gradient(circle at 88% 8%, rgba(29, 78, 216, 0.09), transparent 48%),
          linear-gradient(145deg, #ffffff, #f5f7fa);
        box-shadow:
          inset 0 0 0 1px rgba(20, 26, 36, 0.09),
          0 12px 34px rgba(0, 0, 0, 0.16);
      }

      html[data-theme='light'] .title,
      html[data-theme='light'] .picker-title {
        color: #1a2130;
      }

      html[data-theme='light'] .status {
        color: #6d7684;
      }

      html[data-theme='light'] .title-input:hover {
        background: rgba(20, 26, 36, 0.05);
      }

      html[data-theme='light'] .title-input:focus {
        border-color: rgba(29, 78, 216, 0.35);
        background: rgba(20, 26, 36, 0.05);
      }

      html[data-theme='light'] .icon-button,
      html[data-theme='light'] .add-button {
        border-color: rgba(20, 26, 36, 0.1);
        background: rgba(20, 26, 36, 0.04);
        color: #263243;
      }

      html[data-theme='light'] .icon-button:hover,
      html[data-theme='light'] .add-button:hover {
        border-color: rgba(29, 78, 216, 0.35);
        background: rgba(29, 78, 216, 0.09);
      }

      html[data-theme='light'] .tile {
        color: #1e2733;
      }

      html[data-theme='light'] .tile:hover {
        border-color: rgba(20, 26, 36, 0.08);
        background: rgba(20, 26, 36, 0.05);
      }

      html[data-theme='light'] .tile.drop-target {
        border-color: rgba(29, 78, 216, 0.35);
        background: rgba(29, 78, 216, 0.08);
      }

      html[data-theme='light'] .tile.merge-target {
        border-color: rgba(109, 40, 217, 0.7);
        background: rgba(109, 40, 217, 0.1);
        box-shadow: 0 0 0 2px rgba(109, 40, 217, 0.16);
      }

      html[data-theme='light'] .plate {
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3)),
          rgba(20, 26, 36, 0.06);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 5px 12px rgba(0, 0, 0, 0.12);
      }

      html[data-theme='light'] .label {
        color: #263243;
      }

      html[data-theme='light'] .bundle-plate {
        background: rgba(20, 26, 36, 0.07);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 5px 12px rgba(0, 0, 0, 0.12);
      }

      html[data-theme='light'] .empty {
        color: #6d7684;
      }

      html[data-theme='light'] .empty strong {
        color: #263243;
      }

      html[data-theme='light'] .picker {
        border-color: rgba(20, 26, 36, 0.1);
        background: rgba(252, 252, 251, 0.98);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.2);
      }

      html[data-theme='light'] .search {
        border-color: rgba(20, 26, 36, 0.12);
        background: rgba(20, 26, 36, 0.04);
        color: #1a2130;
        color-scheme: light;
      }

      html[data-theme='light'] .search:focus {
        border-color: rgba(29, 78, 216, 0.45);
      }

      html[data-theme='light'] .picker-row {
        color: #263243;
      }

      html[data-theme='light'] .picker-row:hover {
        background: rgba(20, 26, 36, 0.05);
      }

      html[data-theme='light'] .picker-row input {
        accent-color: #1d4ed8;
      }

      html[data-theme='light'] .picker-icon {
        background: rgba(20, 26, 36, 0.07);
      }

      html[data-theme='light'] .hidden-toggle {
        color: #6d7684;
      }

      html[data-theme='light'] .picker-button {
        border-color: rgba(20, 26, 36, 0.12);
        background: rgba(20, 26, 36, 0.04);
        color: #263243;
      }

      html[data-theme='light'] .picker-button.primary {
        border-color: rgba(29, 78, 216, 0.4);
        background: rgba(29, 78, 216, 0.12);
      }

      html[data-theme='light'] .error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="header">
        <div class="heading">
          <h1 class="title">
            <input
              class="title-input"
              id="title-input"
              value="Apps"
              maxlength="32"
              aria-label="App grid title"
              spellcheck="false"
            />
          </h1>
          <span class="status" id="status">Starting app scan�?�</span>
        </div>
        <div class="actions">
          <button
            class="icon-button"
            id="refresh"
            type="button"
            aria-label="Refresh apps"
            title="Refresh apps"
          >
            ↻
          </button>
          <button class="add-button" id="add" type="button">Add apps</button>
        </div>
      </header>
      <div class="grid" id="grid" role="grid" aria-label="Installed apps"></div>
      <div class="empty" id="empty" hidden>
        <strong>No apps yet</strong>
        <span>Use Add apps to build your grid.</span>
      </div>
      <div class="picker" id="picker" hidden>
        <div class="picker-head">
          <h2 class="picker-title">Add apps</h2>
          <button class="picker-button" id="picker-close" type="button">Close</button>
        </div>
        <input
          class="search"
          id="search"
          type="search"
          autocomplete="off"
          placeholder="Search apps"
          aria-label="Search apps"
        />
        <div class="picker-list" id="picker-list"></div>
        <div class="picker-foot">
          <label class="hidden-toggle">
            <input type="checkbox" id="show-hidden" />
            Show hidden entries
          </label>
          <div class="picker-actions">
            <button class="picker-button" id="picker-cancel" type="button">Cancel</button>
            <button class="picker-button primary" id="picker-add" type="button" disabled>
              Add
            </button>
          </div>
        </div>
      </div>
      <div class="toast" id="toast" role="status" hidden>
        <span class="toast-text" id="toast-text"></span>
        <button id="toast-action" type="button" hidden></button>
      </div>
    </main>
    <script>
      ;(function () {
        'use strict'

        var TILE_WIDTH = 80
        var TILE_GAP = 12
        var DRAG_THRESHOLD = 8
        var MERGE_HOVER_MS = 500

        var grid = document.getElementById('grid')
        var empty = document.getElementById('empty')
        var titleInput = document.getElementById('title-input')
        var statusNode = document.getElementById('status')
        var refreshButton = document.getElementById('refresh')
        var addButton = document.getElementById('add')
        var picker = document.getElementById('picker')
        var pickerList = document.getElementById('picker-list')
        var pickerClose = document.getElementById('picker-close')
        var pickerCancel = document.getElementById('picker-cancel')
        var pickerAdd = document.getElementById('picker-add')
        var searchInput = document.getElementById('search')
        var showHiddenInput = document.getElementById('show-hidden')
        var toast = document.getElementById('toast')
        var toastText = document.getElementById('toast-text')
        var toastAction = document.getElementById('toast-action')

        var state = { widgetId: '', title: 'Apps', apps: [], items: [] }
        var titleSaving = false
        var selected = new Set()
        var activeIndex = 0
        var toastTimer = null
        var pickerOpen = false
        var refreshBusy = false
        var drag = null
        var hoverTarget = null
        var mergeTimer = null
        var mergeTargetKey = null
        var suppressClick = false

        function setStatus(text) {
          if (statusNode) {
            statusNode.textContent = text
          }
        }

        function applyTitle(title) {
          state.title = typeof title === 'string' && title.trim() ? title.trim() : 'Apps'
          if (document.activeElement !== titleInput) {
            titleInput.value = state.title
          }
        }

        function saveTitle() {
          if (titleSaving) {
            return
          }
          var next = titleInput.value.trim().slice(0, 32)
          if (!next) {
            titleInput.value = state.title
            return
          }
          if (next === state.title) {
            titleInput.value = next
            return
          }
          titleSaving = true
          window.hl.grid
            .renameTitle(next)
            .then(function (result) {
              applyState(result)
              setStatus('Title saved')
            })
            .catch(function (error) {
              titleInput.value = state.title
              showError(error && error.message ? error.message : 'Could not rename the app grid.')
            })
            .then(function () {
              titleSaving = false
            })
        }

        function hashHue(name) {
          var hash = 0
          for (var index = 0; index < name.length; index += 1) {
            hash = (hash * 31 + name.charCodeAt(index)) >>> 0
          }
          return hash % 360
        }

        function plateStyle(name) {
          var hue = hashHue(name)
          return (
            'background: linear-gradient(145deg, hsl(' +
            hue +
            ' 58% 44%), hsl(' +
            ((hue + 38) % 360) +
            ' 62% 28%));'
          )
        }

        function letterFor(name) {
          return (name.trim().charAt(0) || '?').toUpperCase()
        }

        function appIcon(app, mini) {
          var node
          if (app.iconUrl) {
            node = document.createElement('img')
            node.alt = ''
            node.draggable = false
            node.src = app.iconUrl
            node.addEventListener('error', function () {
              node.replaceWith(letterNode(app.name, mini))
            })
          } else {
            node = letterNode(app.name, mini)
          }
          return node
        }

        function letterNode(name, mini) {
          var node = document.createElement('span')
          node.className = mini ? 'bundle-mini' : 'letter'
          node.textContent = letterFor(name)
          node.setAttribute('style', plateStyle(name))
          return node
        }

        function makePlate(app) {
          var plate = document.createElement('span')
          plate.className = 'plate'
          plate.appendChild(appIcon(app, false))
          return plate
        }

        function bundlePlate(bundle) {
          var plate = document.createElement('span')
          plate.className = 'bundle-plate'
          for (var index = 0; index < 4; index += 1) {
            var app = bundle.apps[index]
            if (app) {
              var mini = document.createElement('span')
              mini.className = 'bundle-mini'
              var art = appIcon(app, true)
              if (art.classList.contains('bundle-mini')) {
                mini.textContent = art.textContent
                mini.setAttribute('style', art.getAttribute('style') || '')
              } else {
                mini.appendChild(art)
              }
              plate.appendChild(mini)
            } else {
              var blank = document.createElement('span')
              blank.className = 'bundle-mini'
              plate.appendChild(blank)
            }
          }
          return plate
        }

        function tileLabel(text) {
          var label = document.createElement('span')
          label.className = 'label'
          label.textContent = text
          return label
        }

        function makeTile(item, index) {
          var tile = document.createElement('button')
          tile.type = 'button'
          tile.className = 'tile'
          tile.dataset.key = item.key
          tile.dataset.index = String(index)
          tile.setAttribute('role', 'gridcell')
          tile.tabIndex = index === activeIndex ? 0 : -1

          if (item.type === 'app') {
            tile.dataset.appId = item.app.id
            tile.setAttribute('aria-label', item.app.name)
            tile.title = item.app.name
            var icon = document.createElement('span')
            icon.className = 'tile-icon'
            icon.appendChild(makePlate(item.app))
            tile.appendChild(icon)
            tile.appendChild(tileLabel(item.app.name))
          } else {
            tile.dataset.bundleId = item.bundle.id
            tile.setAttribute(
              'aria-label',
              item.bundle.name + ', ' + item.bundle.apps.length + ' apps'
            )
            tile.title = item.bundle.name
            var bundleIcon = document.createElement('span')
            bundleIcon.className = 'tile-icon'
            bundleIcon.appendChild(bundlePlate(item.bundle))
            tile.appendChild(bundleIcon)
            tile.appendChild(tileLabel(item.bundle.name))
          }

          return tile
        }

        function renderGrid() {
          var previous = new Map()
          Array.prototype.forEach.call(grid.querySelectorAll('.tile'), function (tile) {
            previous.set(tile.dataset.key, tile.getBoundingClientRect())
          })

          grid.replaceChildren()
          empty.hidden = state.items.length > 0
          if (state.items.length === 0) {
            grid.hidden = true
            setStatus(state.apps.length ? 'Add apps to get started' : 'No apps found')
            return
          }
          grid.hidden = false

          if (activeIndex >= state.items.length) {
            activeIndex = Math.max(0, state.items.length - 1)
          }
          for (var index = 0; index < state.items.length; index += 1) {
            grid.appendChild(makeTile(state.items[index], index))
          }

          var tiles = grid.querySelectorAll('.tile')
          Array.prototype.forEach.call(tiles, function (tile, index) {
            var before = previous.get(tile.dataset.key)
            if (!before) {
              return
            }
            var after = tile.getBoundingClientRect()
            var dx = before.left - after.left
            var dy = before.top - after.top
            if (dx === 0 && dy === 0) {
              return
            }
            tile.style.transition = 'none'
            tile.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)'
            requestAnimationFrame(function () {
              tile.style.transition = 'transform 120ms ease'
              tile.style.transform = ''
            })
          })

          setStatus(
            state.apps.length
              ? state.apps.length + ' installed app' + (state.apps.length === 1 ? '' : 's')
              : 'No apps found'
          )
          focusActive(false)
        }

        function focusActive(scroll) {
          var tiles = grid.querySelectorAll('.tile')
          Array.prototype.forEach.call(tiles, function (tile, index) {
            tile.tabIndex = index === activeIndex ? 0 : -1
          })
          var active = tiles[activeIndex]
          if (active && scroll) {
            active.focus()
            active.scrollIntoView({ block: 'nearest', inline: 'nearest' })
          }
        }

        function applyState(next) {
          if (!next || !Array.isArray(next.items) || !Array.isArray(next.apps)) {
            return
          }
          state = next
          applyTitle(next.title)
          renderGrid()
          if (pickerOpen) {
            renderPicker()
          }
        }

        function refreshState() {
          return window.hl.grid
            .getState()
            .then(function (next) {
              applyState(next)
              return next
            })
            .catch(function (error) {
              showError(error && error.message ? error.message : 'Could not load apps.')
            })
        }

        function showError(message) {
          setStatus(message)
        }

        function hideToast() {
          toast.hidden = true
          toastAction.hidden = true
          toastAction.onclick = null
          if (toastTimer) {
            clearTimeout(toastTimer)
            toastTimer = null
          }
        }

        function showToast(message, actionLabel, action) {
          hideToast()
          toastText.textContent = message
          if (actionLabel && action) {
            toastAction.textContent = actionLabel
            toastAction.hidden = false
            toastAction.onclick = function () {
              hideToast()
              action()
            }
          }
          toast.hidden = false
          toastTimer = setTimeout(hideToast, 6000)
        }

        function launchApp(appId) {
          window.hl.launch.app(appId).catch(function (error) {
            var message =
              error && error.code === 'not_found'
                ? 'That app is no longer available.'
                : (error && error.message) || 'Could not launch the app.'
            showToast(message, 'Remove from grid', function () {
              window.hl.grid
                .removeApp(appId)
                .then(applyState)
                .catch(function (removeError) {
                  showError(
                    removeError && removeError.message
                      ? removeError.message
                      : 'Could not remove the app.'
                  )
                })
            })
          })
        }

        function openBundle(bundleId, tile) {
          var rect = tile.getBoundingClientRect()
          window.hl.grid
            .openBundle(bundleId, {
              x: rect.left,
              y: rect.top,
              width: rect.width,
              height: rect.height
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not open the bundle.')
            })
        }

        function activateTile(index) {
          var item = state.items[index]
          if (!item) {
            return
          }
          var tile = grid.querySelector('[data-index="' + index + '"]')
          if (item.type === 'app') {
            launchApp(item.app.id)
          } else if (tile) {
            openBundle(item.bundle.id, tile)
          }
        }

        function appsOnGrid() {
          var present = new Set()
          for (var index = 0; index < state.items.length; index += 1) {
            var item = state.items[index]
            if (item.type === 'app') {
              present.add(item.app.id)
            } else {
              for (var appIndex = 0; appIndex < item.bundle.apps.length; appIndex += 1) {
                present.add(item.bundle.apps[appIndex].id)
              }
            }
          }
          return present
        }

        function renderPicker() {
          var query = searchInput ? searchInput.value.trim().toLowerCase() : ''
          var showHidden = Boolean(showHiddenInput && showHiddenInput.checked)
          var present = appsOnGrid()
          var apps = state.apps
            .filter(function (app) {
              if (app.hidden && !showHidden) {
                return false
              }
              return !query || app.name.toLowerCase().indexOf(query) >= 0
            })
            .slice()
            .sort(function (left, right) {
              return left.name.localeCompare(right.name, undefined, { sensitivity: 'base' })
            })

          pickerList.replaceChildren()
          if (apps.length === 0) {
            var emptyNode = document.createElement('p')
            emptyNode.className = 'empty'
            emptyNode.textContent = query ? 'No apps match that search.' : 'No apps found.'
            pickerList.appendChild(emptyNode)
          }

          for (var index = 0; index < apps.length; index += 1) {
            var app = apps[index]
            var onGrid = present.has(app.id)
            var row = document.createElement('label')
            row.className = 'picker-row' + (onGrid ? ' disabled' : '')

            var checkbox = document.createElement('input')
            checkbox.type = 'checkbox'
            checkbox.checked = onGrid || selected.has(app.id)
            checkbox.disabled = onGrid
            checkbox.addEventListener(
              'change',
              (function (appId, node) {
                return function () {
                  if (node.checked) {
                    selected.add(appId)
                  } else {
                    selected.delete(appId)
                  }
                  updatePickerAdd()
                }
              })(app.id, checkbox)
            )

            var icon = document.createElement('span')
            icon.className = 'picker-icon'
            var art = appIcon(app, true)
            if (art.classList.contains('bundle-mini')) {
              icon.textContent = art.textContent
              icon.setAttribute('style', art.getAttribute('style') || '')
            } else {
              icon.appendChild(art)
            }

            var name = document.createElement('span')
            name.className = 'picker-name'
            name.textContent = app.name + (onGrid ? ' · added' : '')

            row.appendChild(checkbox)
            row.appendChild(icon)
            row.appendChild(name)
            pickerList.appendChild(row)
          }

          updatePickerAdd()
        }

        function updatePickerAdd() {
          pickerAdd.disabled = selected.size === 0
          pickerAdd.textContent = selected.size ? 'Add (' + selected.size + ')' : 'Add'
        }

        function openPicker() {
          selected.clear()
          pickerOpen = true
          picker.hidden = false
          if (searchInput) {
            searchInput.value = ''
            searchInput.focus()
          }
          renderPicker()
        }

        function closePicker() {
          pickerOpen = false
          picker.hidden = true
          selected.clear()
          var tiles = grid.querySelectorAll('.tile')
          if (tiles[activeIndex]) {
            tiles[activeIndex].focus()
          }
        }

        function addSelected() {
          var appIds = Array.from(selected)
          if (appIds.length === 0) {
            return
          }
          pickerAdd.disabled = true
          window.hl.grid
            .addApps(appIds)
            .then(function (next) {
              applyState(next)
              closePicker()
            })
            .catch(function (error) {
              updatePickerAdd()
              showToast((error && error.message) || 'Could not add the apps.')
            })
        }

        function clearHover() {
          if (hoverTarget) {
            hoverTarget.classList.remove('drop-target', 'merge-target')
          }
          hoverTarget = null
          mergeTargetKey = null
          if (mergeTimer) {
            clearTimeout(mergeTimer)
            mergeTimer = null
          }
        }

        function insideMiddle(rect, x, y) {
          var nx = (x - rect.left) / rect.width
          var ny = (y - rect.top) / rect.height
          return nx >= 0.2 && nx <= 0.8 && ny >= 0.2 && ny <= 0.8
        }

        function updateDrag(event) {
          if (!drag) {
            return
          }
          var dx = event.clientX - drag.startX
          var dy = event.clientY - drag.startY
          if (!drag.active && Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) {
            return
          }

          if (!drag.active) {
            drag.active = true
            suppressClick = true
            drag.tile.classList.add('dragging')
            drag.ghost = drag.tile.cloneNode(true)
            drag.ghost.className = 'tile drag-ghost'
            drag.ghost.removeAttribute('data-index')
            document.body.appendChild(drag.ghost)
          }

          drag.ghost.style.left = event.clientX + 'px'
          drag.ghost.style.top = event.clientY + 'px'

          var element = document.elementFromPoint(event.clientX, event.clientY)
          var target = element ? element.closest('.tile') : null
          if (!target || target === drag.tile) {
            clearHover()
            return
          }

          if (target !== hoverTarget) {
            clearHover()
            hoverTarget = target
            target.classList.add('drop-target')
          }

          var inMiddle = insideMiddle(target.getBoundingClientRect(), event.clientX, event.clientY)
          if (!inMiddle) {
            target.classList.remove('merge-target')
            mergeTargetKey = null
            if (mergeTimer) {
              clearTimeout(mergeTimer)
              mergeTimer = null
            }
          } else if (!mergeTimer && !mergeTargetKey) {
            mergeTimer = setTimeout(function () {
              if (hoverTarget === target) {
                target.classList.add('merge-target')
                mergeTargetKey = target.dataset.key || null
              }
            }, MERGE_HOVER_MS)
          }
        }

        function finishDrag(event) {
          if (!drag) {
            return
          }
          var current = drag
          var sourceKey = mergeTargetKey
          drag = null
          clearHover()

          if (current.ghost) {
            current.ghost.remove()
          }
          current.tile.classList.remove('dragging')

          if (!current.active) {
            return
          }

          var targetElement = document.elementFromPoint(event.clientX, event.clientY)
          var target = targetElement ? targetElement.closest('.tile') : null
          var targetIndex = target ? Number(target.dataset.index) : state.items.length - 1
          var sourceItem = state.items[current.index]
          if (!sourceItem) {
            return
          }

          if (sourceItem.type === 'app' && sourceKey) {
            window.hl.grid
              .merge(sourceItem.app.id, sourceKey)
              .then(applyState)
              .catch(function (error) {
                showToast((error && error.message) || 'Could not create the bundle.')
              })
            return
          }

          if (!Number.isInteger(targetIndex) || targetIndex === current.index) {
            return
          }

          window.hl.grid
            .move(current.index, targetIndex)
            .then(applyState)
            .catch(function (error) {
              showToast((error && error.message) || 'Could not move the app.')
            })
        }

        grid.addEventListener('pointerdown', function (event) {
          if (event.button !== 0) {
            return
          }
          var tile = event.target.closest('.tile')
          if (!tile || pickerOpen) {
            return
          }
          activeIndex = Number(tile.dataset.index) || 0
          suppressClick = false
          drag = {
            tile: tile,
            index: activeIndex,
            startX: event.clientX,
            startY: event.clientY,
            active: false,
            ghost: null
          }
          try {
            tile.setPointerCapture(event.pointerId)
          } catch {
            // Pointer capture is best-effort.
          }
        })

        grid.addEventListener('dragstart', function (event) {
          event.preventDefault()
        })
        grid.addEventListener('pointermove', updateDrag)
        grid.addEventListener('pointerup', finishDrag)
        grid.addEventListener('pointercancel', function () {
          if (drag && drag.ghost) {
            drag.ghost.remove()
          }
          if (drag) {
            drag.tile.classList.remove('dragging')
          }
          drag = null
          clearHover()
        })

        grid.addEventListener('click', function (event) {
          if (suppressClick) {
            suppressClick = false
            return
          }
          var tile = event.target.closest('.tile')
          if (!tile || pickerOpen) {
            return
          }
          activateTile(Number(tile.dataset.index))
        })

        grid.addEventListener('keydown', function (event) {
          var tiles = grid.querySelectorAll('.tile')
          if (tiles.length === 0) {
            return
          }
          var columns = Math.max(
            1,
            Math.floor((grid.clientWidth + TILE_GAP) / (TILE_WIDTH + TILE_GAP))
          )
          var next = activeIndex
          if (event.key === 'ArrowRight') {
            next += 1
          } else if (event.key === 'ArrowLeft') {
            next -= 1
          } else if (event.key === 'ArrowDown') {
            next += columns
          } else if (event.key === 'ArrowUp') {
            next -= columns
          } else if (event.key === 'Home') {
            next = 0
          } else if (event.key === 'End') {
            next = tiles.length - 1
          } else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault()
            activateTile(activeIndex)
            return
          } else {
            return
          }
          event.preventDefault()
          activeIndex = Math.min(tiles.length - 1, Math.max(0, next))
          focusActive(true)
        })

        refreshButton.addEventListener('click', function () {
          if (refreshBusy) {
            return
          }
          refreshBusy = true
          refreshButton.classList.add('busy')
          setStatus('Refreshing apps…')
          window.hl.apps
            .refresh()
            .then(function (apps) {
              state.apps = apps
              return refreshState()
            })
            .catch(function (error) {
              showToast((error && error.message) || 'Could not refresh apps.')
            })
            .then(function () {
              refreshBusy = false
              refreshButton.classList.remove('busy')
            })
        })

        addButton.addEventListener('click', openPicker)
        pickerClose.addEventListener('click', closePicker)
        pickerCancel.addEventListener('click', closePicker)
        pickerAdd.addEventListener('click', addSelected)
        searchInput.addEventListener('input', renderPicker)
        showHiddenInput.addEventListener('change', renderPicker)

        titleInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault()
            titleInput.blur()
          } else if (event.key === 'Escape') {
            event.preventDefault()
            event.stopPropagation()
            titleInput.value = state.title
            titleInput.blur()
          }
        })

        titleInput.addEventListener('blur', saveTitle)

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && pickerOpen) {
            event.preventDefault()
            closePicker()
          }
        })

        if (!window.hl || !window.hl.grid) {
          showError('The app grid needs the widget bridge.')
          return
        }

        window.hl
          .ready()
          .then(function () {
            return window.hl.grid.getState()
          })
          .then(function (next) {
            applyState(next)
          })
          .catch(function (error) {
            showError(error && error.message ? error.message : 'Could not load apps.')
          })

        window.hl.onApps(function (apps) {
          if (Array.isArray(apps)) {
            state.apps = apps
            refreshState()
          }
        })

        window.hl.onEditMode(function () {
          // Edit mode is handled by the shell overlay for this widget.
        })

        function applyTheme(dark) {
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        }

        window.hl
          .getContext()
          .then(function (context) {
            applyTheme(context.dark)
          })
          .catch(function () {})

        window.hl.onTheme(function (theme) {
          applyTheme(theme.dark)
        })
      })()
    </script>
  </body>
</html>
