<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <link rel="stylesheet" href="widget://_builtins/env/extras.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .card.w {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    html[data-variant='serif'] .quote--serif,
    html:not([data-variant]) .quote--serif { display: grid; }
    html[data-variant='bare'] .quote--bare { display: grid; }

    .quote__by {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 600 10.5px/1 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .quote__by::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--accent);
    }

    .quote--serif {
      width: 100%;
      padding: 28px 26px 24px;
      display: grid;
      gap: 16px;
      align-content: center;
    }
    .quote--serif::before {
      content: "\201C";
      height: 36px;
      font: 900 88px/.8 var(--font-serif);
      color: var(--accent);
    }
    .quote--serif .quote__text {
      font: italic 500 25px/1.28 var(--font-serif);
      letter-spacing: -.01em;
    }

    .quote--bare {
      width: 100%;
      display: grid;
      gap: 18px;
      align-content: center;
    }
    .quote--bare .quote__text {
      padding-left: 20px;
      border-left: 4px solid var(--accent-2);
      font: 300 clamp(30px, 5vw, 44px)/1.12 var(--font-sans);
      letter-spacing: -.035em;
    }
    .quote--bare .quote__by { padding-left: 24px; }
  </style>
</head>
<body>

  <main class="card w quote quote--serif">
    <p class="quote__text" data-quote>Start before you feel ready.</p>
    <p class="quote__by" data-quote-no>Line of the day</p>
  </main>

  <main class="card w w--bare quote quote--bare">
    <p class="quote__text" data-quote>Start before you feel ready.</p>
    <p class="quote__by" data-quote-no>Line of the day</p>
  </main>

  <script src="widget://_builtins/env/extras.js"></script>
  <script>
    (() => {
      'use strict';

      const { $$, doyOf, every, initEnv, initTheme, content } = window.HLW;
      initEnv('serif');
      initTheme();

      const cfg = content();
      const customText = typeof cfg.text === 'string' ? cfg.text.trim() : '';
      const customLabel = typeof cfg.label === 'string' ? cfg.label.trim() : '';

      const QUOTES = [
        'Do the next small thing, and do it well.',
        'Momentum is just courage, repeated.',
        'A quiet day is also a day that counted.',
        'Make it work, then make it kind.',
        'The best view comes after the hardest climb.',
        'Start before you feel ready.',
        'Rest is part of the work.'
      ];

      function quote() {
        const day = doyOf(new Date());
        $$('[data-quote]').forEach((element) => {
          element.textContent = customText || QUOTES[day % QUOTES.length];
        });
        $$('[data-quote-no]').forEach((element) => {
          element.textContent = customLabel || `Line of the day · No. ${day}`;
        });
      }

      quote();
      every(quote, 60000);
    })();
  </script>
</body>
</html>
