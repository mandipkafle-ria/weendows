<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clock</title>
    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('widget://_fonts/DotGothic16-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: 'DotGothic16', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 16px 18px 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        background:
          radial-gradient(circle at 85% 12%, rgba(119, 92, 255, 0.2), transparent 44%),
          linear-gradient(145deg, rgba(24, 21, 35, 0.95), rgba(12, 11, 18, 0.92));
        box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .time {
        margin: 0;
        color: #f4f1ff;
        font-size: 48px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: 0.02em;
        text-shadow: 0 0 24px rgba(132, 108, 255, 0.2);
      }

      .date {
        margin: 0;
        color: rgba(231, 227, 246, 0.62);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .accent {
        width: 28px;
        height: 2px;
        margin-bottom: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, #8f7bff, rgba(143, 123, 255, 0));
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="time" id="time">--:--</p>
      <div>
        <div class="accent"></div>
        <p class="date" id="date"></p>
      </div>
    </main>
    <script>
      ;(function () {
        'use strict'

        var timeNode = document.getElementById('time')
        var dateNode = document.getElementById('date')

        function render() {
          var now = new Date()
          if (timeNode) {
            timeNode.textContent = now.toLocaleTimeString([], {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            })
          }
          if (dateNode) {
            dateNode.textContent = now.toLocaleDateString([], {
              weekday: 'short',
              month: 'short',
              day: 'numeric'
            })
          }
        }

        render()
        setInterval(render, 15000)

        if (window.hl && typeof window.hl.ready === 'function') {
          window.hl.ready(function (context) {
            document.documentElement.dataset.widget = context.id
          })
        }
      })()
    </script>
  </body>
</html>
