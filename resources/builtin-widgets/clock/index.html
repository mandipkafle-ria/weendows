<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clock</title>
    <script>
      document.documentElement.dataset.variant =
        new URLSearchParams(location.search).get('variant') || 'classic'
    </script>
    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('widget://_fonts/DotGothic16-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --ink: #f4f1ea;
        --muted: #9aa0ab;
        --faint: #646b77;
        --surface: rgba(16, 18, 23, 0.94);
        --surface-2: rgba(24, 27, 34, 0.96);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent: #ff7a45;
        --accent-2: #a78bfa;
        --accent-soft: rgba(255, 122, 69, 0.15);
        --glow: rgba(255, 122, 69, 0.24);
        --radius: 18px;
        --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        --font-display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      }

      html[data-theme='light'] {
        --ink: #1e1c18;
        --muted: #656159;
        --faint: #918b81;
        --surface: rgba(251, 250, 246, 0.96);
        --surface-2: #ffffff;
        --line: rgba(20, 18, 14, 0.09);
        --line-strong: rgba(20, 18, 14, 0.16);
        --accent: #c2410c;
        --accent-2: #6d28d9;
        --accent-soft: rgba(194, 65, 12, 0.09);
        --glow: rgba(194, 65, 12, 0.18);
      }

      html[data-variant='neon'] {
        --accent: #5fffd0;
        --accent-2: #a78bfa;
        --accent-soft: rgba(95, 255, 208, 0.12);
        --glow: rgba(95, 255, 208, 0.32);
      }

      html[data-variant='terminal'] {
        --accent: #64ff9e;
        --accent-soft: rgba(100, 255, 158, 0.1);
        --glow: rgba(100, 255, 158, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 15px 17px 13px;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius);
        background:
          radial-gradient(15rem 9rem at 86% 4%, var(--accent-soft), transparent 64%),
          linear-gradient(150deg, var(--surface-2), var(--surface));
        box-shadow:
          inset 0 0 0 1px var(--line),
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 12px 34px rgba(0, 0, 0, 0.22);
        background-clip: padding-box;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--faint);
        font-family: var(--font-ui);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .brand::before {
        content: '';
        width: 5px;
        height: 5px;
        margin-right: 1px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--glow);
      }

      .brand span:first-child {
        margin-right: auto;
      }

      .face {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .time {
        margin: 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 48px;
        font-weight: 300;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.035em;
        line-height: 0.94;
      }

      .seconds {
        margin-left: 3px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .date {
        margin: 0;
        color: var(--muted);
        font-family: var(--font-ui);
        font-size: 9.5px;
        font-weight: 650;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-top: 7px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .pulse {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--glow);
      }

      .dial {
        display: none;
        flex: 1;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 4px 0;
      }

      .dial svg {
        display: block;
        width: min(100%, 190px);
        height: min(100%, 190px);
      }

      .dial-ring {
        fill: none;
        stroke: var(--line-strong);
        stroke-width: 0.8;
      }

      .dial-face {
        fill: color-mix(in srgb, var(--surface-2) 55%, transparent);
        stroke: var(--line);
        stroke-width: 0.6;
      }

      .dial-tick {
        stroke: var(--faint);
        stroke-width: 1;
        stroke-linecap: round;
      }

      .dial-tick.major {
        stroke: var(--ink);
        stroke-width: 1.6;
      }

      .hand {
        stroke: var(--ink);
        stroke-linecap: round;
      }

      .hand-second {
        stroke: var(--accent);
      }

      .dial-center {
        fill: var(--accent);
      }

      html[data-variant='minimal'] .card {
        justify-content: center;
        gap: 2px;
        padding: 5px 10px;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      html[data-variant='minimal'] .brand,
      html[data-variant='minimal'] .footer,
      html[data-variant='minimal'] .seconds {
        display: none;
      }

      html[data-variant='minimal'] .time {
        font-size: 60px;
        font-weight: 250;
      }

      html[data-variant='minimal'] .date {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.14em;
      }

      html[data-variant='neon'] .card {
        background:
          radial-gradient(14rem 9rem at 90% 0%, var(--accent-soft), transparent 62%),
          linear-gradient(150deg, #0c1218, #080b10);
        box-shadow:
          inset 0 0 0 1px rgba(95, 255, 208, 0.2),
          0 0 24px rgba(95, 255, 208, 0.08);
      }

      html[data-variant='neon'] .time {
        color: #eafff9;
        text-shadow:
          0 0 14px var(--glow),
          0 0 40px var(--glow);
      }

      html[data-variant='neon'] .date {
        color: rgba(223, 255, 247, 0.56);
      }

      html[data-variant='neon'] .footer {
        border-top-color: rgba(95, 255, 208, 0.14);
        color: rgba(223, 255, 247, 0.4);
      }

      html[data-variant='analog'] .card {
        align-items: center;
        gap: 3px;
        padding: 9px 13px 11px;
      }

      html[data-variant='analog'] .brand,
      html[data-variant='analog'] .footer {
        display: none;
      }

      html[data-variant='analog'] .dial {
        display: flex;
        width: 100%;
      }

      html[data-variant='analog'] .face {
        align-items: center;
        gap: 0;
      }

      html[data-variant='analog'] .time {
        display: none;
      }

      html[data-variant='analog'] .date {
        font-size: 8.5px;
      }

      html[data-variant='terminal'] .card {
        padding: 10px 12px 9px;
        border-radius: 12px;
        background:
          radial-gradient(12rem 8rem at 94% 0%, rgba(100, 255, 158, 0.08), transparent 60%), #07100a;
        box-shadow: inset 0 0 0 1px rgba(100, 255, 158, 0.18);
        font-family: 'DotGothic16', monospace;
      }

      html[data-variant='terminal'] .brand {
        color: rgba(191, 255, 211, 0.56);
        font-family: 'DotGothic16', monospace;
        font-size: 8px;
        letter-spacing: 0.06em;
      }

      html[data-variant='terminal'] .time {
        color: #c4ffd8;
        font-family: 'DotGothic16', monospace;
        font-size: 44px;
        letter-spacing: 0;
        text-shadow: 0 0 12px rgba(100, 255, 158, 0.24);
      }

      html[data-variant='terminal'] .time::before {
        content: '> ';
        color: var(--accent);
      }

      html[data-variant='terminal'] .date {
        color: rgba(191, 255, 211, 0.48);
        font-family: 'DotGothic16', monospace;
        font-size: 9px;
        letter-spacing: 0.02em;
        text-transform: none;
      }

      html[data-variant='terminal'] .footer {
        border-top-style: dashed;
        border-top-color: rgba(100, 255, 158, 0.16);
        color: rgba(191, 255, 211, 0.4);
        font-family: 'DotGothic16', monospace;
      }

      html[data-variant='terminal'] .footer .pulse {
        border-radius: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <span>Local</span>
        <span id="zone"></span>
      </div>
      <div class="dial" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle class="dial-ring" cx="50" cy="50" r="47.5"></circle>
          <circle class="dial-face" cx="50" cy="50" r="40"></circle>
          <g id="ticks"></g>
          <line
            class="hand"
            id="hour-hand"
            x1="50"
            y1="50"
            x2="50"
            y2="30"
            stroke-width="2.6"
          ></line>
          <line
            class="hand"
            id="minute-hand"
            x1="50"
            y1="50"
            x2="50"
            y2="19"
            stroke-width="1.6"
          ></line>
          <line
            class="hand hand-second"
            id="second-hand"
            x1="50"
            y1="55"
            x2="50"
            y2="16"
            stroke-width="0.9"
          ></line>
          <circle class="dial-center" cx="50" cy="50" r="2.2"></circle>
        </svg>
      </div>
      <div class="face">
        <p class="time"><span id="time">--:--</span><span class="seconds" id="seconds"></span></p>
        <p class="date" id="date"></p>
      </div>
      <div class="footer">
        <span class="pulse"></span>
        <span id="daypart">Today</span>
      </div>
    </main>
    <script>
      ;(function () {
        'use strict'

        var timeNode = document.getElementById('time')
        var secondsNode = document.getElementById('seconds')
        var dateNode = document.getElementById('date')
        var zoneNode = document.getElementById('zone')
        var daypartNode = document.getElementById('daypart')
        var hourHand = document.getElementById('hour-hand')
        var minuteHand = document.getElementById('minute-hand')
        var secondHand = document.getElementById('second-hand')
        var ticksNode = document.getElementById('ticks')

        function buildTicks() {
          if (!ticksNode) {
            return
          }
          for (var index = 0; index < 12; index += 1) {
            var angle = (index * 30 * Math.PI) / 180
            var outer = 44
            var inner = index % 3 === 0 ? 38.5 : 40.5
            var tick = document.createElementNS('http://www.w3.org/2000/svg', 'line')
            tick.setAttribute('x1', String(50 + Math.sin(angle) * inner))
            tick.setAttribute('y1', String(50 - Math.cos(angle) * inner))
            tick.setAttribute('x2', String(50 + Math.sin(angle) * outer))
            tick.setAttribute('y2', String(50 - Math.cos(angle) * outer))
            tick.setAttribute('class', 'dial-tick' + (index % 3 === 0 ? ' major' : ''))
            ticksNode.appendChild(tick)
          }
        }

        function rotate(node, degrees) {
          if (node) {
            node.setAttribute('transform', 'rotate(' + degrees + ' 50 50)')
          }
        }

        function render() {
          var now = new Date()
          var hours = now.getHours()
          var minutes = now.getMinutes()
          var seconds = now.getSeconds()

          if (timeNode) {
            timeNode.textContent =
              String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0')
          }
          if (secondsNode) {
            secondsNode.textContent = ':' + String(seconds).padStart(2, '0')
          }
          if (dateNode) {
            dateNode.textContent = now.toLocaleDateString([], {
              weekday: 'short',
              month: 'short',
              day: 'numeric'
            })
          }
          if (zoneNode) {
            zoneNode.textContent =
              Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop() || 'local'
          }
          if (daypartNode) {
            daypartNode.textContent = hours < 12 ? 'Morning' : hours < 18 ? 'Afternoon' : 'Evening'
          }

          rotate(hourHand, (hours % 12) * 30 + minutes * 0.5)
          rotate(minuteHand, minutes * 6 + seconds * 0.1)
          rotate(secondHand, seconds * 6)
        }

        buildTicks()
        render()
        setInterval(render, 1000)

        function applyTheme(dark) {
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        }

        if (window.hl) {
          window.hl
            .ready()
            .then(function () {
              return window.hl.getContext()
            })
            .then(function (context) {
              applyTheme(context.dark)
            })
            .catch(function () {})
          window.hl.onTheme(function (state) {
            applyTheme(state.dark)
          })
        }
      })()
    </script>
  </body>
</html>
