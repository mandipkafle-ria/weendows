<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battery</title>
    <script>
      document.documentElement.dataset.variant =
        new URLSearchParams(location.search).get('variant') || 'ring'
    </script>
    <style>
      :root {
        --ink: #f3f7f4;
        --muted: #98a49c;
        --faint: #667169;
        --surface: rgba(16, 21, 18, 0.95);
        --surface-2: rgba(24, 31, 27, 0.96);
        --line: rgba(255, 255, 255, 0.075);
        --track: rgba(255, 255, 255, 0.09);
        --charge: #6ee7a8;
        --charge-soft: rgba(110, 231, 168, 0.14);
        --radius: 18px;
        --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        --font-display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      }

      html[data-theme='light'] {
        --ink: #1a211c;
        --muted: #5e6a61;
        --faint: #939d95;
        --surface: rgba(251, 252, 250, 0.97);
        --surface-2: #ffffff;
        --line: rgba(20, 30, 22, 0.09);
        --track: rgba(20, 30, 22, 0.08);
        --charge: #157f4b;
        --charge-soft: rgba(21, 127, 75, 0.1);
      }

      html[data-level='mid'] {
        --charge: #e3b341;
        --charge-soft: rgba(227, 179, 65, 0.15);
      }

      html[data-theme='light'][data-level='mid'] {
        --charge: #926c00;
        --charge-soft: rgba(146, 108, 0, 0.1);
      }

      html[data-level='low'] {
        --charge: #ff8178;
        --charge-soft: rgba(255, 129, 120, 0.15);
      }

      html[data-theme='light'][data-level='low'] {
        --charge: #b42318;
        --charge-soft: rgba(180, 35, 24, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 14px 17px;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius);
        background:
          radial-gradient(13rem 9rem at 86% 10%, var(--charge-soft), transparent 62%),
          linear-gradient(150deg, var(--surface-2), var(--surface));
        box-shadow:
          inset 0 0 0 1px var(--line),
          0 12px 34px rgba(0, 0, 0, 0.2);
        background-clip: padding-box;
      }

      .indicator {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
      }

      .ring {
        display: grid;
        width: 74px;
        height: 74px;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(var(--charge) 0%, var(--track) 0);
      }

      .ring.charging {
        box-shadow: 0 0 20px var(--charge-soft);
      }

      .ring-inner {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 50%;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .percent {
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 18px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .bar {
        position: relative;
        display: none;
        width: 88px;
        height: 38px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--track);
      }

      .bar::after {
        content: '';
        position: absolute;
        top: 50%;
        right: -4px;
        width: 3px;
        height: 12px;
        border-radius: 0 2px 2px 0;
        background: var(--line);
        transform: translateY(-50%);
      }

      .bar-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--charge),
          color-mix(in srgb, var(--charge) 55%, white)
        );
        box-shadow: 0 0 10px var(--charge-soft);
        transition: width 500ms ease;
      }

      .copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .kicker {
        color: var(--faint);
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .state {
        margin: 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .detail {
        margin: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 8.5px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .detail.error {
        color: #ff8178;
      }

      .bignum {
        display: none;
        flex: none;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 34px;
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: -0.05em;
      }

      .bignum small {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0;
      }

      html[data-variant='bar'] .card {
        gap: 12px;
        padding: 11px 14px;
      }

      html[data-variant='bar'] .ring {
        display: none;
      }

      html[data-variant='bar'] .bar {
        display: block;
      }

      html[data-variant='bar'] .copy {
        gap: 1px;
      }

      html[data-variant='bar'] .state {
        font-size: 15px;
      }

      html[data-variant='bar'] .bignum {
        display: block;
        font-size: 27px;
      }

      html[data-variant='minimal'] .card {
        gap: 12px;
        justify-content: flex-start;
        padding: 8px 12px;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      html[data-variant='minimal'] .indicator {
        display: none;
      }

      html[data-variant='minimal'] .bignum {
        display: block;
        font-size: 48px;
        line-height: 0.9;
      }

      html[data-variant='minimal'] .copy {
        gap: 1px;
        padding-left: 2px;
      }

      html[data-variant='minimal'] .kicker {
        display: none;
      }

      html[data-variant='minimal'] .state {
        font-size: 14px;
      }

      html[data-variant='minimal'] .detail {
        font-size: 8.5px;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="indicator">
        <div class="ring" id="ring">
          <div class="ring-inner">
            <span class="percent" id="percent">--</span>
          </div>
        </div>
        <div class="bar" aria-hidden="true">
          <span class="bar-fill" id="bar-fill"></span>
        </div>
      </div>
      <div class="copy">
        <span class="kicker">Battery</span>
        <p class="state" id="state">Reading…</p>
        <p class="detail" id="detail">Updates every 30 seconds</p>
      </div>
      <span class="bignum" id="bignum">--<small>%</small></span>
    </main>
    <script>
      ;(function () {
        'use strict'

        var ring = document.getElementById('ring')
        var percentNode = document.getElementById('percent')
        var bignumNode = document.getElementById('bignum')
        var stateNode = document.getElementById('state')
        var detailNode = document.getElementById('detail')
        var barFill = document.getElementById('bar-fill')

        function setBignum(percent) {
          if (!bignumNode) {
            return
          }
          if (percent === null) {
            bignumNode.textContent = '--'
            return
          }
          bignumNode.innerHTML = String(percent) + '<small>%</small>'
        }

        function render(battery) {
          var hasLevel = typeof battery.level === 'number'
          var percent = hasLevel ? Math.round(battery.level * 100) : null

          if (percentNode) {
            percentNode.textContent = hasLevel ? percent + '%' : '--'
          }
          setBignum(hasLevel ? percent : null)
          if (ring) {
            var fill = hasLevel ? percent : 0
            ring.style.background =
              'conic-gradient(var(--charge) ' + fill + '%, var(--track) ' + fill + '%)'
            ring.classList.toggle('charging', battery.charging === true)
          }
          if (barFill) {
            barFill.style.width = (hasLevel ? Math.max(0, Math.min(100, percent)) : 0) + '%'
          }
          if (hasLevel) {
            document.documentElement.dataset.level =
              percent <= 15 ? 'low' : percent <= 35 ? 'mid' : 'ok'
          } else {
            delete document.documentElement.dataset.level
          }
          if (stateNode) {
            stateNode.textContent = battery.charging ? 'Charging' : 'On battery'
          }
          if (detailNode) {
            detailNode.classList.remove('error')
            if (!hasLevel) {
              detailNode.textContent = battery.charging
                ? 'Level is not reported on this device'
                : 'Updates every 30 seconds'
            } else {
              detailNode.textContent = battery.charging
                ? 'Connected to power'
                : 'Updates every 30 seconds'
            }
          }
        }

        function tick() {
          if (!window.hl || !window.hl.system) {
            return
          }
          window.hl.system
            .getBattery()
            .then(render)
            .catch(function (error) {
              if (stateNode) {
                stateNode.textContent =
                  error && error.code === 'permission_denied'
                    ? 'Permission is off'
                    : 'Battery unavailable'
              }
              if (detailNode) {
                detailNode.textContent = 'Check the widget permission in Settings'
                detailNode.classList.add('error')
              }
            })
        }

        tick()
        setInterval(tick, 30000)

        function applyTheme(dark) {
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        }

        if (window.hl) {
          window.hl
            .ready()
            .then(function () {
              return window.hl.getContext()
            })
            .then(function (context) {
              applyTheme(context.dark)
            })
            .catch(function () {})
          window.hl.onTheme(function (state) {
            applyTheme(state.dark)
          })
        }
      })()
    </script>
  </body>
</html>
