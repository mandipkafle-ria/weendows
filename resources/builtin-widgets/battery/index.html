<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <style>
    :root {
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius: 24px;
      --radius-sm: 14px;
      --pill: 999px;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    @property --vn { syntax: "<number>"; inherits: true; initial-value: 0; }
    [data-meter] { transition: --vn .9s cubic-bezier(.2,.8,.2,1); }

    .card.w {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 20px;
    }

    /* Variant visibility */
    html[data-variant='ring'] .bat--ring,
    html:not([data-variant]) .bat--ring { display: grid; }
    html[data-variant='bar'] .bat--bar { display: grid; }
    html[data-variant='minimal'] .bat--pill,
    html[data-variant='pill'] .bat--pill { display: flex; }

    .bolt { width: 1.1em; height: 1.1em; fill: currentColor; }

    /* Ring — circular donut */
    .bat--ring { justify-items: center; align-content: center; gap: 12px; }
    .bat--ring .ring {
      --s: 96px; --t: 10px;
      position: relative; width: var(--s); aspect-ratio: 1; display: grid; place-items: center;
      font: 700 14px/1 var(--font-sans); font-variant-numeric: tabular-nums;
    }
    .bat--ring .ring::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--vn) * 360deg), var(--track) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--t) - .5px), #000 calc(100% - var(--t)));
              mask: radial-gradient(farthest-side, transparent calc(100% - var(--t) - .5px), #000 calc(100% - var(--t)));
      filter: drop-shadow(0 0 6px var(--glow));
    }
    .bat--ring .ring__in { position: absolute; display: grid; justify-items: center; gap: 2px; }
    .bat--ring .ring__in .bolt { font-size: 16px; color: var(--accent); filter: drop-shadow(0 0 8px var(--glow)); }
    .bat--ring .ring__in b { font: 700 24px/1 var(--font-sans); letter-spacing: -.03em; }
    .bat--ring .bat__meta { display: grid; gap: 3px; text-align: center; }
    .bat--ring .bat__meta b { font: 600 13px/1 var(--font-sans); }
    .bat--ring .bat__meta span { font: 500 11px/1 var(--font-mono); color: var(--muted); }

    /* Bar — battery cell */
    .bat--bar { gap: 14px; align-content: center; }
    .bat__head { display: flex; justify-content: space-between; align-items: baseline; }
    .bat__head b { font: 700 32px/1 var(--font-sans); letter-spacing: -.04em; }
    .bat__head span { display: inline-flex; gap: 6px; align-items: center; font: 600 12px/1 var(--font-mono); color: var(--accent); }
    .batcell {
      position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
      height: 52px; padding: 5px; border: 2px solid var(--muted); border-radius: 14px; margin-right: 9px;
    }
    .batcell::after {
      content: ""; position: absolute; right: -9px; top: 50%; translate: 0 -50%;
      width: 5px; height: 20px; border-radius: 0 5px 5px 0; background: var(--muted);
    }
    .batcell i {
      border-radius: 6px; background: var(--accent);
      opacity: calc(.1 + .9 * clamp(0, calc((var(--vn) * 10 - var(--i)) * 4), 1));
      box-shadow: 0 0 12px -2px var(--glow);
    }

    /* Minimal — compact pill */
    .bat--pill {
      align-items: center; justify-content: center; gap: 10px;
      padding: 10px 18px 10px 14px; border-radius: var(--pill);
    }
    .bat--pill .bolt { font-size: 14px; color: var(--accent); }
    .pillbar { width: 64px; height: 8px; border-radius: 9px; background: var(--track); overflow: hidden; }
    .pillbar i { display: block; height: 100%; width: calc(var(--vn) * 100%); border-radius: inherit; background: var(--accent); }
    .bat--pill b { font: 700 14px/1 var(--font-sans); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <!-- SVG Sprite -->
  <svg width="0" height="0" style="position:absolute;display:none" aria-hidden="true">
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
  </svg>

  <!-- Variant: Ring -->
  <main class="card w bat bat--ring" data-variant-view="ring">
    <div class="ring" data-meter="bat">
      <div class="ring__in"><svg class="bolt"><use href="#i-bolt"/></svg><b data-meter-text="bat">82%</b></div>
    </div>
    <div class="bat__meta"><b id="bat-state-ring">On battery</b><span id="bat-detail-ring">Updates regularly</span></div>
  </main>

  <!-- Variant: Bar -->
  <main class="card w bat bat--bar" data-variant-view="bar">
    <div class="bat__head">
      <b data-meter-text="bat">82%</b>
      <span><svg class="bolt" id="bat-bolt-bar"><use href="#i-bolt"/></svg><span id="bat-state-bar">On battery</span></span>
    </div>
    <div class="batcell" data-meter="bat">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i>
      <i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i>
    </div>
  </main>

  <!-- Variant: Minimal / Pill -->
  <main class="card w bat bat--pill" data-variant-view="minimal">
    <svg class="bolt"><use href="#i-bolt"/></svg>
    <span class="pillbar" data-meter="bat"><i></i></span>
    <b data-meter-text="bat">82%</b>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const rawVariant = params.get('variant') || 'ring';
      const variant = rawVariant === 'pill' ? 'minimal' : rawVariant;
      document.documentElement.dataset.variant = variant;
      const env = params.get('env');
      if (env) document.documentElement.dataset.env = env;
      const theme = params.get('theme') || 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.mode = theme;

      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
      let batteryLevel = 82;
      let isCharging = false;

      const level = (k, v) => (v <= 20 ? 'bad' : v <= 40 ? 'warn' : 'ok');

      function paintMeters() {
        $$('[data-meter="bat"]').forEach(el => {
          el.style.setProperty('--vn', (batteryLevel / 100).toFixed(3));
          el.dataset.level = level('bat', batteryLevel);
        });
        $$('[data-meter-text="bat"]').forEach(el => {
          el.textContent = Math.round(batteryLevel) + '%';
        });

        const stateText = isCharging ? 'Charging' : 'On battery';
        const ringState = document.getElementById('bat-state-ring');
        if (ringState) ringState.textContent = stateText;
        const barState = document.getElementById('bat-state-bar');
        if (barState) barState.textContent = stateText;

        const ringDetail = document.getElementById('bat-detail-ring');
        if (ringDetail) {
          ringDetail.textContent = isCharging ? 'Connected to power' : 'Running on battery';
        }
      }

      function tick() {
        if (!window.hl || !window.hl.system) {
          paintMeters();
          return;
        }
        window.hl.system.getBattery()
          .then(battery => {
            if (battery && typeof battery.level === 'number') {
              batteryLevel = Math.max(0, Math.min(100, Math.round(battery.level * 100)));
              isCharging = Boolean(battery.charging);
            }
            paintMeters();
          })
          .catch(() => {
            paintMeters();
          });
      }

      tick();
      setInterval(tick, 10000);

      function applyTheme(dark) {
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      }

      if (window.hl) {
        window.hl.ready()
          .then(() => window.hl.getContext())
          .then(ctx => { if (ctx && typeof ctx.dark === 'boolean') applyTheme(ctx.dark); })
          .catch(() => {});
        window.hl.onTheme(state => {
          if (state && typeof state.dark === 'boolean') applyTheme(state.dark);
        });
      }
    })();
  </script>
</body>
</html>
