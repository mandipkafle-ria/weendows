<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <style>
    :root {
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --font-hand: "Caveat", "Segoe Print", cursive;
      --radius: 24px;
      --radius-sm: 14px;
      --pill: 999px;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .card.w {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 20px;
    }

    /* Variant visibility */
    html[data-variant='grid'] .cal--grid,
    html:not([data-variant]) .cal--grid { display: flex; flex-direction: column; }
    html[data-variant='compact'] .cal--compact { display: flex; flex-direction: column; }
    html[data-variant='paper'] .cal--paper { display: flex; flex-direction: column; }

    .cal__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal__title b { font: 700 22px/1 var(--font-sans); letter-spacing: -.02em; }
    .cal__title span { margin-left: 7px; font: 500 14px/1 var(--font-sans); color: var(--muted); }
    .cal__nav { display: flex; gap: 6px; }
    .cal__nav button {
      appearance: none; width: 28px; height: 28px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      font: 600 15px/1 var(--font-sans); transition: background .2s, color .2s;
    }
    .cal__nav button:hover { background: var(--accent); color: var(--accent-ink); }
    .cal__dow, .cal__days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal__dow span {
      padding: 4px 0 8px; text-align: center;
      font: 600 10px/1 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
    .cal__days { flex: 1; align-content: start; }
    .cal__d {
      position: relative; display: grid; place-items: center; justify-self: center;
      width: 32px; height: 32px; border-radius: 10px; font: 500 13px/1 var(--font-sans);
      font-variant-numeric: tabular-nums;
    }
    .cal__d.is-out { color: var(--muted); opacity: .35; }
    .cal__d.is-weekend { color: var(--accent-2); }
    .cal__d.is-today { background: var(--grad); color: var(--on-grad); font-weight: 700; box-shadow: 0 6px 16px -4px var(--glow); }
    .cal__d.has-event::after {
      content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    }
    .cal__d.is-today.has-event::after { background: var(--on-grad); }

    /* Compact */
    .cal--compact { padding: 14px 14px 12px; }
    .cal--compact .cal__head { margin-bottom: 8px; }
    .cal--compact .cal__title b { font-size: 15px; }
    .cal--compact .cal__title span { font-size: 12px; }
    .cal--compact .cal__nav button { width: 22px; height: 22px; font-size: 12px; border-radius: 7px; }
    .cal--compact .cal__dow { display: none; }
    .cal--compact .cal__d { width: 26px; height: 26px; font-size: 12px; border-radius: 8px; }
    .cal--compact .cal__d.has-event::after { bottom: 3px; width: 3px; height: 3px; }

    /* Paper */
    .cal--paper {
      --sheet: #f9f4e4; --ink: #243a8c; --rule: rgba(70,110,190,.30);
      background:
        radial-gradient(circle at 17px 34px, var(--page) 6px, rgba(0,0,0,.2) 6.6px, transparent 8.5px) 0 0 / 100% 68px repeat-y,
        var(--sheet);
      border-color: rgba(0,0,0,.08); color: #2a2a35;
      padding: 18px 18px 12px 50px; font-family: var(--font-hand);
    }
    .cal--paper::before {
      content: ""; position: absolute; inset: 0 auto 0 38px; width: 2px; background: rgba(214,64,64,.5);
    }
    .cal--paper .cal__head { margin-bottom: 6px; }
    .cal--paper .cal__title b { font: 700 32px/1 var(--font-hand); color: var(--ink); letter-spacing: 0; }
    .cal--paper .cal__title span { font: 600 18px/1 var(--font-hand); color: rgba(36,58,140,.6); }
    .cal--paper .cal__nav button { background: transparent; border-color: var(--rule); color: var(--ink); }
    .cal--paper .cal__dow span { padding: 2px 0 4px; font: 700 15px/1 var(--font-hand); letter-spacing: .02em; text-transform: none; color: var(--ink); }
    .cal--paper .cal__days {
      grid-auto-rows: 25px;
      background: repeating-linear-gradient(to bottom, transparent 0 24px, var(--rule) 24px 25px);
    }
    .cal--paper .cal__d {
      width: auto; height: 25px; justify-self: stretch; border-radius: 0;
      font: 600 18px/1 var(--font-hand); color: #2a2a35;
    }
    .cal--paper .cal__d.is-weekend { color: #a33; }
    .cal--paper .cal__d.is-out { opacity: .28; }
    .cal--paper .cal__d.is-today { background: none; box-shadow: none; color: #c22; }
    .cal--paper .cal__d.is-today::before {
      content: ""; position: absolute; inset: 0 6px; border: 2px solid #d33;
      border-radius: 52% 46% 54% 48% / 56% 50% 50% 44%; transform: rotate(-5deg);
    }
    .cal--paper .cal__d.has-event::after { background: var(--ink); bottom: 2px; }
    .cal__planner { margin-top: 6px; }
    .cal__planner p {
      height: 25px; line-height: 24px; border-bottom: 1px solid var(--rule); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; font: 500 18px/24px var(--font-hand); color: var(--ink);
    }
  </style>
</head>
<body>

  <!-- Variant: Grid -->
  <main class="card w cal cal--grid" data-variant-view="grid">
    <div data-calendar="grid" data-events="3,9,14,22,29"></div>
  </main>

  <!-- Variant: Compact -->
  <main class="card w cal cal--compact" data-variant-view="compact">
    <div data-calendar="compact" data-events="3,9,14,22,29"></div>
  </main>

  <!-- Variant: Paper -->
  <main class="card w cal cal--paper" data-variant-view="paper">
    <div data-calendar="paper" data-events="3,9,14,22,29"></div>
    <div class="cal__planner"><p>Thu — ship the widget pack</p><p>Sat — long walk, no phone</p></div>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const variant = params.get('variant') || 'grid';
      document.documentElement.dataset.variant = variant;
      const env = params.get('env');
      if (env) document.documentElement.dataset.env = env;
      const theme = params.get('theme') || 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.mode = theme;

      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
      const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      const calState = new WeakMap();

      function renderCalendar(root) {
        const variant = root.dataset.calendar || 'grid';
        const weekStart = +(root.dataset.weekStart || 0);
        const events = (root.dataset.events || '').split(',').map(Number).filter(Boolean);
        const today = new Date();
        const st = calState.get(root) || { y: today.getFullYear(), m: today.getMonth() };
        calState.set(root, st);

        const first = new Date(st.y, st.m, 1);
        const lead = (first.getDay() - weekStart + 7) % 7;
        const dim = new Date(st.y, st.m + 1, 0).getDate();
        const prevDim = new Date(st.y, st.m, 0).getDate();
        const total = variant === 'compact' ? Math.ceil((lead + dim) / 7) * 7 : 42;
        const isThisMonth = st.y === today.getFullYear() && st.m === today.getMonth();

        let cells = '';
        for (let i = 0; i < total; i++) {
          const n = i - lead + 1, inMonth = n >= 1 && n <= dim;
          const label = n < 1 ? prevDim + n : n > dim ? n - dim : n;
          const dow = (i + weekStart) % 7;
          const cls = [
            'cal__d',
            !inMonth && 'is-out',
            inMonth && (dow === 0 || dow === 6) && 'is-weekend',
            inMonth && isThisMonth && n === today.getDate() && 'is-today',
            inMonth && isThisMonth && events.includes(n) && 'has-event'
          ].filter(Boolean).join(' ');
          cells += `<span class="${cls}">${label}</span>`;
        }
        const dowNames = Array.from({ length: 7 }, (_, i) => DAYS[(i + weekStart) % 7]);
        const dow = dowNames.map(n => `<span>${variant === 'paper' ? n.slice(0, 3) : n[0]}</span>`).join('');

        root.innerHTML =
          `<div class="cal__head"><div class="cal__title"><b>${MONTHS[st.m]}</b><span>${st.y}</span></div>` +
          `<div class="cal__nav"><button type="button" data-nav="-1" aria-label="Previous month">‹</button>` +
          `<button type="button" data-nav="1" aria-label="Next month">›</button></div></div>` +
          `<div class="cal__dow">${dow}</div><div class="cal__days">${cells}</div>`;
      }

      function renderCalendars() {
        $$('[data-calendar]').forEach(renderCalendar);
      }

      document.addEventListener('click', e => {
        const btn = e.target.closest('[data-calendar] [data-nav]');
        if (!btn) return;
        const root = btn.closest('[data-calendar]'), st = calState.get(root);
        const d = new Date(st.y, st.m + (+btn.dataset.nav), 1);
        st.y = d.getFullYear();
        st.m = d.getMonth();
        renderCalendar(root);
      });

      renderCalendars();

      function applyTheme(dark) {
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      }

      if (window.hl) {
        window.hl.ready()
          .then(() => window.hl.getContext())
          .then(ctx => { if (ctx && typeof ctx.dark === 'boolean') applyTheme(ctx.dark); })
          .catch(() => {});
        window.hl.onTheme(state => {
          if (state && typeof state.dark === 'boolean') applyTheme(state.dark);
        });
      }
    })();
  </script>
</body>
</html>
