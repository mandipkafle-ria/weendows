<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greeting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <link rel="stylesheet" href="widget://_builtins/env/extras.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .card.w {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    html[data-variant='bare'] .greet--bare,
    html:not([data-variant]) .greet--bare { display: grid; }
    html[data-variant='card'] .greet--card { display: flex; }

    .greet {
      display: grid;
      gap: 10px;
      align-content: center;
      padding: 18px 22px;
    }

    .greet__line {
      font: 300 clamp(40px, 8vw, 66px)/1 var(--font-sans);
      letter-spacing: -.045em;
    }
    .greet__line b {
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-right: .04em;
    }

    .greet__sub {
      font: 500 14px/1 var(--font-mono);
      letter-spacing: .08em;
      color: var(--muted);
    }

    .greet__ico {
      flex: none;
      width: 54px;
      height: 54px;
      border-radius: 50%;
    }
    [data-part='day'] .greet__ico {
      background: radial-gradient(circle at 35% 30%, #ffe9a8, #ffb347);
      box-shadow: 0 0 0 8px rgba(255, 190, 70, .16), 0 0 34px rgba(255, 180, 60, .55);
    }
    [data-part='night'] .greet__ico {
      background: transparent;
      box-shadow: inset 17px -9px 0 0 #e6eaff;
      filter: drop-shadow(0 0 14px rgba(190, 200, 255, .5));
    }

    .greet--card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 24px;
    }
    .greet--card .greet__line { font-size: 30px; }
    .greet--card .greet__body { display: grid; gap: 10px; }
  </style>
</head>
<body>

  <main class="card w w--bare greet greet--bare" data-part="day">
    <h2 class="greet__line">Good <b data-greet>morning</b></h2>
    <p class="greet__sub"><span data-bind="weekday">Saturday</span> · <span data-bind="monthLong">October</span> <span data-bind="day">31</span></p>
  </main>

  <main class="card w greet greet--card" data-part="day">
    <span class="greet__ico"></span>
    <div class="greet__body">
      <h2 class="greet__line">Good <b data-greet>morning</b></h2>
      <p class="greet__sub"><span data-bind="wd3">Sat</span>, <span data-bind="mon3">Oct</span> <span data-bind="day">31</span></p>
    </div>
  </main>

  <script src="widget://_builtins/env/extras.js"></script>
  <script>
    (() => {
      'use strict';

      const { $$, dateInfo, every, initEnv, initTheme } = window.HLW;
      initEnv('bare');
      initTheme();

      function tick() {
        const now = new Date();
        const info = dateInfo(now);
        const hour = now.getHours();
        const part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';

        $$('.greet').forEach((root) => {
          root.dataset.part = part === 'evening' || hour >= 19 || hour < 6 ? 'night' : 'day';
        });
        $$('[data-greet]').forEach((element) => {
          element.textContent = part;
        });
        $$('[data-bind]').forEach((element) => {
          const value = info[element.dataset.bind];
          if (value !== undefined && element.textContent !== value) {
            element.textContent = value;
          }
        });
      }

      tick();
      every(tick, 30000);
    })();
  </script>
</body>
</html>
