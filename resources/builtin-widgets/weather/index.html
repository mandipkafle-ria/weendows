<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <style>
    :root {
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius: 24px;
      --radius-sm: 14px;
      --pill: 999px;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    .card.w {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 20px;
    }

    /* Variant visibility */
    html[data-variant='classic'] .wx--classic,
    html:not([data-variant]) .wx--classic { display: flex; }
    html[data-variant='compact'] .wx--compact { display: flex; }
    html[data-variant='station'] .wx--station { display: grid; }

    .wx { --sun: #ffc24a; --cloud: #f1f5ff; --cloud-edge: rgba(0,0,0,.10); }
    [data-mode="light"] .wx, [data-theme="light"] .wx { --cloud: #c9d7f0; --cloud-edge: rgba(30,60,120,.18); }
    .wx__icon { filter: drop-shadow(0 10px 14px rgba(0,0,0,.28)); }

    /* Classic */
    .wx--classic {
      background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%), var(--surface);
      flex-direction: column; justify-content: space-between;
    }
    .wx--classic .wx__top { display: flex; justify-content: space-between; align-items: flex-start; }
    .wx--classic .wx__temp { margin-top: 4px; font: 300 70px/1 var(--font-sans); letter-spacing: -.06em; }
    .wx--classic .wx__icon { width: 72px; height: 72px; }
    .wx--classic .wx__cond { margin-top: 6px; font: 600 16px/1 var(--font-sans); }
    .wx--classic .wx__hl { display: flex; gap: 14px; margin-top: 6px; font: 500 12px/1 var(--font-mono); color: var(--muted); }

    /* Compact */
    .wx--compact {
      align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-radius: calc(var(--radius) - 4px);
    }
    .wx--compact .wx__icon { width: 44px; height: 44px; flex: none; filter: none; }
    .wx--compact .wx__temp { font: 600 32px/1 var(--font-sans); letter-spacing: -.03em; }
    .wx--compact .wx__txt { display: grid; gap: 3px; text-align: right; }
    .wx--compact .wx__txt b { font: 600 13px/1 var(--font-sans); }
    .wx--compact .wx__txt span { font: 500 11px/1 var(--font-mono); color: var(--muted); }

    /* Station */
    .wx--station { gap: 10px; align-content: space-between; }
    .wx--station .wx__head { display: flex; justify-content: space-between; align-items: center; }
    .wx--station .wx__temp { font: 600 36px/1 var(--font-sans); letter-spacing: -.05em; margin-top: 4px; }
    .wx--station .wx__sub { margin-top: 4px; font: 500 12px/1 var(--font-sans); color: var(--muted); }
    .wx--station .wx__icon { width: 48px; height: 48px; }
    .wx__spark { width: 100%; height: 36px; }
    .wx__spark path.line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wx__spark path.area { fill: url(#spark-fill); }
    .wx__spark stop { stop-color: var(--accent); }
    .wx__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .wx__grid > div { display: grid; gap: 3px; padding: 7px 9px; background: var(--surface); }
    [data-theme="glass"] .wx__grid > div, [data-env="glass"] .wx__grid > div { background: color-mix(in srgb, var(--surface-2) 100%, transparent); }
    .wx__grid span { font: 600 9px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .wx__grid b { font: 600 13px/1 var(--font-sans); font-variant-numeric: tabular-nums; }
    .wx__grid small { font: 500 10px/1 var(--font-sans); color: var(--muted); }
  </style>
</head>
<body>

  <!-- Shared SVG Icons -->
  <svg width="0" height="0" style="position:absolute;display:none" aria-hidden="true">
    <symbol id="i-sun-cloud" viewBox="0 0 64 64">
      <path d="M22 4v4M8.5 9.5l2.8 2.8M3 23h4M35.5 9.5l-2.8 2.8" fill="none" style="stroke:var(--sun,#ffc24a)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="22" cy="23" r="9" style="fill:var(--sun,#ffc24a)"/>
      <path d="M18 54a11 11 0 0 1-1.5-21.9A15 15 0 0 1 45.6 35 9.5 9.5 0 0 1 46 54z" style="fill:var(--cloud,#f1f5ff);stroke:var(--cloud-edge,rgba(0,0,0,.1))" stroke-width="1.5"/>
    </symbol>
  </svg>

  <!-- Variant: Classic -->
  <main class="card w wx wx--classic" data-variant-view="classic">
    <div class="wx__top">
      <div>
        <span class="w__label" data-bind="city">Kathmandu</span>
        <div class="wx__temp" data-bind="temp">24°</div>
      </div>
      <svg class="wx__icon"><use href="#i-sun-cloud"/></svg>
    </div>
    <div>
      <div class="wx__cond" data-bind="cond">Partly cloudy</div>
      <div class="wx__hl"><span data-bind="high">H 27°</span><span data-bind="low">L 16°</span><span data-bind="feels">Feels 25°</span></div>
    </div>
  </main>

  <!-- Variant: Compact -->
  <main class="card w wx wx--compact" data-variant-view="compact">
    <svg class="wx__icon"><use href="#i-sun-cloud"/></svg>
    <span class="wx__temp" data-bind="temp">24°</span>
    <div class="wx__txt">
      <b data-bind="cond">Partly cloudy</b>
      <span><span data-bind="city">Kathmandu</span> · <span data-bind="high">H 27°</span></span>
    </div>
  </main>

  <!-- Variant: Station -->
  <main class="card w wx wx--station" data-variant-view="station">
    <div class="wx__head">
      <div>
        <span class="w__label"><span data-bind="city">Kathmandu</span> · Station</span>
        <div class="wx__temp" data-bind="temp">24°</div>
        <div class="wx__sub"><span data-bind="cond">Partly cloudy</span> · <span data-bind="feels">feels 25°</span></div>
      </div>
      <svg class="wx__icon"><use href="#i-sun-cloud"/></svg>
    </div>
    <svg class="wx__spark" viewBox="0 0 180 48" preserveAspectRatio="none" aria-label="12 hour temperature">
      <defs><linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-opacity=".35"/><stop offset="1" stop-opacity="0"/></linearGradient></defs>
      <path class="area" d="M0 36 L20 32 L40 27 L60 18 L80 11 L100 13 L120 20 L140 27 L160 32 L180 35 L180 48 L0 48 Z"/>
      <path class="line" d="M0 36 L20 32 L40 27 L60 18 L80 11 L100 13 L120 20 L140 27 L160 32 L180 35"/>
    </svg>
    <div class="wx__grid">
      <div><span>Humidity</span><b>58%</b><small>Comfortable</small></div>
      <div><span>Wind</span><b>12 km/h</b><small>NE</small></div>
      <div><span>Pressure</span><b>1013</b><small>hPa</small></div>
      <div><span>UV index</span><b>6</b><small>High</small></div>
      <div><span>Visibility</span><b>9 km</b><small>Clear</small></div>
      <div><span>Dew point</span><b>15°</b><small>Pleasant</small></div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const variant = params.get('variant') || 'classic';
      document.documentElement.dataset.variant = variant;
      const env = params.get('env');
      if (env) document.documentElement.dataset.env = env;
      const theme = params.get('theme') || 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.mode = theme;

      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

      let city = 'Kathmandu';
      let lat = 27.7172;
      let lon = 85.3240;
      let temp = 24;
      let condition = 'Partly cloudy';

      function updateUI() {
        $$('[data-bind="city"]').forEach(el => el.textContent = city);
        $$('[data-bind="temp"]').forEach(el => el.textContent = Math.round(temp) + '°');
        $$('[data-bind="cond"]').forEach(el => el.textContent = condition);
        $$('[data-bind="high"]').forEach(el => el.textContent = `H ${Math.round(temp + 3)}°`);
        $$('[data-bind="low"]').forEach(el => el.textContent = `L ${Math.round(temp - 7)}°`);
        $$('[data-bind="feels"]').forEach(el => el.textContent = `Feels ${Math.round(temp + 1)}°`);
      }

      function weatherDescription(code) {
        if (code === 0) return 'Clear sky';
        if (code === 1 || code === 2) return 'Partly cloudy';
        if (code === 3) return 'Overcast';
        if (code >= 45 && code <= 48) return 'Foggy';
        if (code >= 51 && code <= 67) return 'Rain showers';
        if (code >= 71 && code <= 77) return 'Snow';
        if (code >= 80 && code <= 82) return 'Rain';
        if (code >= 95) return 'Thunderstorm';
        return 'Clear';
      }

      function fetchWeather() {
        if (!window.hl || !window.hl.net) {
          updateUI();
          return;
        }
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,weather_code&timezone=auto`;
        window.hl.net.fetch(url)
          .then(res => {
            if (!res.ok) throw new Error('status ' + res.status);
            const data = res.json();
            if (data && data.current && typeof data.current.temperature_2m === 'number') {
              temp = data.current.temperature_2m;
              condition = weatherDescription(data.current.weather_code);
              updateUI();
            }
          })
          .catch(() => {
            updateUI();
          });
      }

      updateUI();

      function applyTheme(dark) {
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      }

      if (window.hl) {
        window.hl.ready()
          .then(() => {
            if (window.hl.storage) {
              return Promise.all([
                window.hl.storage.get('lat'),
                window.hl.storage.get('lon'),
                window.hl.storage.get('city')
              ]);
            }
          })
          .then(vals => {
            if (vals && typeof vals[0] === 'number' && typeof vals[1] === 'number') {
              lat = vals[0];
              lon = vals[1];
              if (typeof vals[2] === 'string') city = vals[2];
            }
            fetchWeather();
            return window.hl.getContext();
          })
          .then(ctx => { if (ctx && typeof ctx.dark === 'boolean') applyTheme(ctx.dark); })
          .catch(() => { fetchWeather(); });

        window.hl.onTheme(state => {
          if (state && typeof state.dark === 'boolean') applyTheme(state.dark);
        });

        setInterval(fetchWeather, 1200000);
      }
    })();
  </script>
</body>
</html>
