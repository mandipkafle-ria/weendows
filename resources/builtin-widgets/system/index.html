<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System</title>
    <script>
      document.documentElement.dataset.variant =
        new URLSearchParams(location.search).get('variant') || 'dots'
    </script>
    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('widget://_fonts/DotGothic16-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --ink: #f2f5f8;
        --muted: #949ba6;
        --faint: #626974;
        --surface: rgba(16, 19, 24, 0.95);
        --surface-2: rgba(25, 29, 36, 0.96);
        --line: rgba(255, 255, 255, 0.075);
        --track: rgba(255, 255, 255, 0.08);
        --radius: 18px;
        --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        --font-display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      }

      html[data-theme='light'] {
        --ink: #1b1e23;
        --muted: #60666f;
        --faint: #94999f;
        --surface: rgba(251, 251, 249, 0.97);
        --surface-2: #ffffff;
        --line: rgba(20, 24, 30, 0.09);
        --track: rgba(20, 24, 30, 0.07);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 13px 15px 11px;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius);
        background:
          radial-gradient(14rem 9rem at 90% 0%, rgba(88, 200, 255, 0.1), transparent 62%),
          linear-gradient(150deg, var(--surface-2), var(--surface));
        box-shadow:
          inset 0 0 0 1px var(--line),
          0 12px 34px rgba(0, 0, 0, 0.2);
        background-clip: padding-box;
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .kicker {
        color: var(--faint);
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .title {
        margin: 1px 0 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .uptime {
        padding-top: 2px;
        color: var(--faint);
        font-size: 8px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .metrics {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 9px;
        min-height: 0;
      }

      .metric {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        --metric: #58c8ff;
      }

      .metric.mem {
        --metric: #a78bfa;
      }

      html[data-theme='light'] .metric {
        --metric: #0369a1;
      }

      html[data-theme='light'] .metric.mem {
        --metric: #6d28d9;
      }

      .metric-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .label {
        color: var(--muted);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .value {
        color: var(--ink);
        font-size: 9.5px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      .dots {
        display: grid;
        grid-template-columns: repeat(24, minmax(0, 1fr));
        gap: 2px;
      }

      .dot {
        height: 6px;
        border-radius: 99px;
        background: var(--track);
        transition:
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .dot.on {
        background: var(--metric);
        box-shadow: 0 0 6px color-mix(in srgb, var(--metric) 45%, transparent);
      }

      .bar,
      .ring-wrap,
      .ascii {
        display: none;
      }

      .bar {
        height: 7px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--track);
      }

      .bar span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--metric), color-mix(in srgb, var(--metric) 55%, white));
        transition: width 300ms ease;
      }

      .ring-wrap {
        position: relative;
        width: 66px;
        height: 66px;
        margin: 1px auto 0;
        filter: drop-shadow(0 0 7px color-mix(in srgb, var(--metric) 25%, transparent));
      }

      .ring-wrap svg {
        display: block;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .ring-track,
      .ring-value {
        fill: none;
        stroke-width: 4;
      }

      .ring-track {
        stroke: var(--track);
      }

      .ring-value {
        stroke: var(--metric);
        stroke-linecap: round;
        stroke-dasharray: 163.36;
        stroke-dashoffset: 163.36;
        transition: stroke-dashoffset 400ms ease;
      }

      .ascii {
        margin: 0;
        color: var(--metric);
        font-family: 'DotGothic16', monospace;
        font-size: 9px;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 7.5px;
        letter-spacing: 0.04em;
      }

      .status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status.error {
        color: #ff8a80;
      }

      .signal {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: none;
        font-weight: 650;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .signal::before {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #78d99a;
      }

      html[data-variant='bars'] .card {
        gap: 8px;
      }

      html[data-variant='bars'] .dots {
        display: none;
      }

      html[data-variant='bars'] .bar {
        display: block;
      }

      html[data-variant='bars'] .metrics {
        gap: 13px;
      }

      html[data-variant='bars'] .metric {
        gap: 6px;
      }

      html[data-variant='bars'] .bar {
        height: 9px;
      }

      html[data-variant='rings'] .card {
        gap: 7px;
      }

      html[data-variant='rings'] .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: center;
        gap: 6px;
      }

      html[data-variant='rings'] .metric {
        align-items: center;
        gap: 1px;
      }

      html[data-variant='rings'] .metric-head {
        width: 100%;
      }

      html[data-variant='rings'] .label {
        font-size: 7px;
      }

      html[data-variant='rings'] .value {
        font-size: 8.5px;
      }

      html[data-variant='rings'] .dots {
        display: none;
      }

      html[data-variant='rings'] .ring-wrap {
        display: block;
      }

      html[data-variant='terminal'] .card {
        gap: 8px;
        border-radius: 11px;
        background:
          radial-gradient(13rem 8rem at 90% 0%, rgba(100, 255, 158, 0.07), transparent 60%),
          #07100a;
        box-shadow: inset 0 0 0 1px rgba(100, 255, 158, 0.17);
        font-family: 'DotGothic16', monospace;
      }

      html[data-variant='terminal'] .kicker,
      html[data-variant='terminal'] .title,
      html[data-variant='terminal'] .uptime,
      html[data-variant='terminal'] .label,
      html[data-variant='terminal'] .value,
      html[data-variant='terminal'] .footer {
        color: #9fffc0;
        font-family: 'DotGothic16', monospace;
      }

      html[data-variant='terminal'] .kicker {
        color: rgba(159, 255, 192, 0.52);
      }

      html[data-variant='terminal'] .title {
        font-size: 13px;
      }

      html[data-variant='terminal'] .title::before {
        content: '> ';
        color: #64ff9e;
      }

      html[data-variant='terminal'] .metric {
        --metric: #64ff9e;
      }

      html[data-variant='terminal'] .dots {
        display: none;
      }

      html[data-variant='terminal'] .ascii {
        display: block;
      }

      html[data-variant='terminal'] .footer {
        border-top-style: dashed;
        border-top-color: rgba(100, 255, 158, 0.16);
      }

      html[data-variant='terminal'] .signal::before {
        border-radius: 0;
        background: #64ff9e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <div>
          <span class="kicker">System</span>
          <p class="title">Performance</p>
        </div>
        <span class="uptime" id="uptime"></span>
      </div>
      <div class="metrics">
        <section class="metric cpu">
          <div class="metric-head">
            <span class="label">CPU</span>
            <span class="value" id="cpu-value">--%</span>
          </div>
          <div class="dots" id="cpu-dots" aria-hidden="true"></div>
          <div class="bar" aria-hidden="true"><span id="cpu-bar"></span></div>
          <div class="ring-wrap" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle class="ring-track" cx="32" cy="32" r="26"></circle>
              <circle class="ring-value" id="cpu-ring" cx="32" cy="32" r="26"></circle>
            </svg>
          </div>
          <p class="ascii" id="cpu-ascii"></p>
        </section>
        <section class="metric mem">
          <div class="metric-head">
            <span class="label">Memory</span>
            <span class="value" id="mem-value">--%</span>
          </div>
          <div class="dots" id="mem-dots" aria-hidden="true"></div>
          <div class="bar" aria-hidden="true"><span id="mem-bar"></span></div>
          <div class="ring-wrap" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle class="ring-track" cx="32" cy="32" r="26"></circle>
              <circle class="ring-value" id="mem-ring" cx="32" cy="32" r="26"></circle>
            </svg>
          </div>
          <p class="ascii" id="mem-ascii"></p>
        </section>
      </div>
      <div class="footer">
        <span class="status" id="status">Sampling every 2 seconds</span>
        <span class="signal" id="signal">Local</span>
      </div>
    </main>
    <script>
      ;(function () {
        'use strict'

        var DOT_COUNT = 24
        var CIRCUMFERENCE = 163.36
        var cpuDots = document.getElementById('cpu-dots')
        var memDots = document.getElementById('mem-dots')
        var cpuValue = document.getElementById('cpu-value')
        var memValue = document.getElementById('mem-value')
        var cpuBar = document.getElementById('cpu-bar')
        var memBar = document.getElementById('mem-bar')
        var cpuRing = document.getElementById('cpu-ring')
        var memRing = document.getElementById('mem-ring')
        var cpuAscii = document.getElementById('cpu-ascii')
        var memAscii = document.getElementById('mem-ascii')
        var uptime = document.getElementById('uptime')
        var status = document.getElementById('status')

        function buildDots(parent) {
          if (!parent) {
            return []
          }
          var nodes = []
          for (var index = 0; index < DOT_COUNT; index += 1) {
            var dot = document.createElement('span')
            dot.className = 'dot'
            nodes.push(dot)
            parent.appendChild(dot)
          }
          return nodes
        }

        var cpuNodes = buildDots(cpuDots)
        var memNodes = buildDots(memDots)

        function clamp(value) {
          return Math.max(0, Math.min(100, value))
        }

        function paint(nodes, percent) {
          var count = Math.round((clamp(percent) / 100) * DOT_COUNT)
          for (var index = 0; index < nodes.length; index += 1) {
            nodes[index].classList.toggle('on', index < count)
          }
        }

        function ascii(percent) {
          var filled = Math.round((clamp(percent) / 100) * 10)
          return '[' + '#'.repeat(filled) + '.'.repeat(10 - filled) + ']'
        }

        function formatUptime(seconds) {
          var days = Math.floor(seconds / 86400)
          var hours = Math.floor((seconds % 86400) / 3600)
          var minutes = Math.floor((seconds % 3600) / 60)
          if (days > 0) {
            return days + 'd ' + hours + 'h'
          }
          if (hours > 0) {
            return hours + 'h ' + minutes + 'm'
          }
          return minutes + 'm'
        }

        function render(stats) {
          var cpu = clamp(stats.cpuPercent)
          var memory = clamp(stats.memUsedPercent)
          paint(cpuNodes, cpu)
          paint(memNodes, memory)
          if (cpuValue) {
            cpuValue.textContent = Math.round(cpu) + '%'
          }
          if (memValue) {
            memValue.textContent =
              Math.round(memory) + '% of ' + stats.memTotalGB.toFixed(1) + ' GB'
          }
          if (cpuBar) {
            cpuBar.style.width = cpu + '%'
          }
          if (memBar) {
            memBar.style.width = memory + '%'
          }
          if (cpuRing) {
            cpuRing.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - cpu / 100))
          }
          if (memRing) {
            memRing.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - memory / 100))
          }
          if (cpuAscii) {
            cpuAscii.textContent = 'CPU ' + ascii(cpu) + ' ' + Math.round(cpu) + '%'
          }
          if (memAscii) {
            memAscii.textContent = 'MEM ' + ascii(memory) + ' ' + Math.round(memory) + '%'
          }
          if (uptime) {
            uptime.textContent = 'up ' + formatUptime(stats.uptimeSec)
          }
          if (status) {
            status.textContent = 'Sampling every 2 seconds'
            status.classList.remove('error')
          }
        }

        function tick() {
          if (!window.hl || !window.hl.system) {
            return
          }
          window.hl.system.getStats().then(render).catch(function (error) {
            if (status) {
              status.textContent = error && error.code === 'permission_denied'
                ? 'System stats permission is off'
                : 'System stats unavailable'
              status.classList.add('error')
            }
          })
        }

        tick()
        setInterval(tick, 2000)

        function applyTheme(dark) {
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        }

        if (window.hl) {
          window.hl.ready()
            .then(function () {
              return window.hl.getContext()
            })
            .then(function (context) {
              applyTheme(context.dark)
            })
            .catch(function () {})
          window.hl.onTheme(function (state) {
            applyTheme(state.dark)
          })
        }
      })()
    </script>
  </body>
</html>
