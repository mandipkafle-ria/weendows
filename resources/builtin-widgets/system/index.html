<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget://_builtins/env/theme.css">
  <style>
    :root {
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius: 24px;
      --radius-sm: 14px;
      --pill: 999px;
      --term: #4dff88;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    @property --vn { syntax: "<number>"; inherits: true; initial-value: 0; }
    [data-meter] { transition: --vn .9s cubic-bezier(.2,.8,.2,1); }

    .card.w {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 13px 18px;
    }

    /* Variant visibility */
    html[data-variant='dots'] .sys--dots,
    html:not([data-variant]) .sys--dots { display: grid; }
    html[data-variant='bars'] .sys--bars { display: grid; }
    html[data-variant='rings'] .sys--rings { display: grid; }
    html[data-variant='terminal'] .sys--terminal { display: block; }

    .sys { gap: 8px; align-content: space-between; }
    .sys__row { display: grid; gap: 4px; }
    .sys__top { display: flex; justify-content: space-between; align-items: baseline; }
    .sys__top span { font: 600 10.5px/1 var(--font-mono); letter-spacing: .16em; color: var(--muted); }
    .sys__top b { font: 700 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Dots — VU-style LEDs */
    .vu {
      position: relative; height: 10px; background: var(--track);
      -webkit-mask: radial-gradient(circle at 5px 5px, #000 3px, transparent 3.8px) 0 0 / 10px 10px repeat-x;
              mask: radial-gradient(circle at 5px 5px, #000 3px, transparent 3.8px) 0 0 / 10px 10px repeat-x;
    }
    .vu i {
      position: absolute; inset: 0 auto 0 0; width: calc(var(--vn) * 100%);
      background: linear-gradient(90deg, var(--accent) 0 58%, var(--warn) 80%, var(--bad));
      background-size: calc(100% / var(--vn)) 100%;
    }

    /* Bars — horizontal progress */
    .bar { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: calc(var(--vn) * 100%); border-radius: inherit;
      background: var(--grad); box-shadow: 0 0 14px -2px var(--glow);
    }

    /* Rings — circular gauges */
    .ring {
      --s: 68px; --t: 8px;
      position: relative; width: var(--s); aspect-ratio: 1; display: grid; place-items: center;
      font: 700 14px/1 var(--font-sans); font-variant-numeric: tabular-nums;
    }
    .ring::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--vn) * 360deg), var(--track) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--t) - .5px), #000 calc(100% - var(--t)));
              mask: radial-gradient(farthest-side, transparent calc(100% - var(--t) - .5px), #000 calc(100% - var(--t)));
      filter: drop-shadow(0 0 6px var(--glow));
    }
    .sys__rings-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: center; }
    .sys__cell { display: grid; justify-items: center; gap: 8px; }
    .sys__cell > span { font: 600 10px/1 var(--font-mono); letter-spacing: .18em; color: var(--muted); }

    /* Terminal — CLI ASCII brackets */
    .sys--terminal {
      background: #040704; color: var(--term); padding: 16px;
      border-color: color-mix(in srgb, var(--term) 28%, transparent);
    }
    .sys--terminal pre {
      margin: 0; font: 500 12.5px/1.5 var(--font-mono); white-space: pre;
      text-shadow: 0 0 6px color-mix(in srgb, var(--term) 55%, transparent);
    }
    .sys--terminal::after {
      z-index: 1; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    }
  </style>
</head>
<body>

  <!-- Variant: Dots -->
  <main class="card w sys sys--dots" data-variant-view="dots">
    <span class="w__label">System</span>
    <div class="sys__row"><div class="sys__top"><span>CPU</span><b data-meter-text="cpu">42%</b></div><div class="vu" data-meter="cpu"><i></i></div></div>
    <div class="sys__row"><div class="sys__top"><span>MEM</span><b data-meter-text="mem">68%</b></div><div class="vu" data-meter="mem"><i></i></div></div>
    <div class="sys__row"><div class="sys__top"><span>UPTIME</span><b data-meter-text="uptime">3d 14h</b></div><div class="vu" data-meter="dsk"><i></i></div></div>
  </main>

  <!-- Variant: Bars -->
  <main class="card w sys sys--bars" data-variant-view="bars">
    <span class="w__label">System</span>
    <div class="sys__row"><div class="sys__top"><span>CPU</span><b data-meter-text="cpu">42%</b></div><div class="bar" data-meter="cpu"><i></i></div></div>
    <div class="sys__row"><div class="sys__top"><span>MEM</span><b data-meter-text="mem">68%</b></div><div class="bar" data-meter="mem"><i></i></div></div>
    <div class="sys__row"><div class="sys__top"><span>UPTIME</span><b data-meter-text="uptime">3d 14h</b></div><div class="bar" data-meter="dsk"><i></i></div></div>
  </main>

  <!-- Variant: Rings -->
  <main class="card w sys sys--rings" data-variant-view="rings">
    <span class="w__label">System</span>
    <div class="sys__rings-wrap">
      <div class="sys__cell"><div class="ring" data-meter="cpu"><b data-meter-text="cpu">42%</b></div><span>CPU</span></div>
      <div class="sys__cell"><div class="ring" data-meter="mem"><b data-meter-text="mem">68%</b></div><span>MEM</span></div>
      <div class="sys__cell"><div class="ring" data-meter="dsk"><b data-meter-text="dsk">55%</b></div><span>LOAD</span></div>
    </div>
  </main>

  <!-- Variant: Terminal -->
  <main class="card w sys sys--terminal" data-variant-view="terminal">
    <pre data-sys-terminal></pre>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const variant = params.get('variant') || 'dots';
      document.documentElement.dataset.variant = variant;
      const env = params.get('env');
      if (env) document.documentElement.dataset.env = env;
      const theme = params.get('theme') || 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.mode = theme;

      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

      const meters = { cpu: 42, mem: 68, dsk: 55, uptime: '3d 14h' };
      let uptimeSec = 300000;

      const level = (k, v) => (v >= 90 ? 'bad' : v >= 75 ? 'warn' : 'ok');
      const bar = (v, n = 14) => { const f = Math.round(v / 100 * n); return '#'.repeat(f) + '.'.repeat(n - f); };

      function asciiBox(title, lines, inner = 28) {
        const top = '╭─[ ' + title + ' ]' + '─'.repeat(Math.max(0, inner - title.length - 5)) + '╮';
        const body = lines.map(l => '│ ' + String(l).padEnd(inner - 1).slice(0, inner - 1) + '│');
        return [top, ...body, '╰' + '─'.repeat(inner) + '╯'].join('\n');
      }

      function formatUptime(seconds) {
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        if (days > 0) return `${days}d ${hours}h`;
        if (hours > 0) return `${hours}h ${minutes}m`;
        return `${minutes}m`;
      }

      function paintMeters() {
        $$('[data-meter]').forEach(el => {
          const k = el.dataset.meter;
          const v = meters[k];
          if (v === undefined || typeof v !== 'number') return;
          el.style.setProperty('--vn', (v / 100).toFixed(3));
          el.dataset.level = level(k, v);
        });
        $$('[data-meter-text]').forEach(el => {
          const k = el.dataset.meterText;
          const v = meters[k];
          if (v !== undefined) {
            el.textContent = typeof v === 'number' ? Math.round(v) + '%' : v;
          }
        });
        $$('[data-sys-terminal]').forEach(pre => {
          const row = (n, k) => `${n} [${bar(meters[k])}] ${String(Math.round(meters[k])).padStart(3)}%`;
          pre.textContent = asciiBox('sys', [
            row('CPU', 'cpu'),
            row('MEM', 'mem'),
            row('DSK', 'dsk'),
            '',
            `load ${(meters.cpu / 100).toFixed(2)}  up ${meters.uptime}`
          ], 26);
        });
      }

      function tick() {
        if (!window.hl || !window.hl.system) {
          paintMeters();
          return;
        }
        window.hl.system.getStats()
          .then(stats => {
            meters.cpu = clamp(stats.cpuPercent, 0, 100);
            meters.mem = clamp(stats.memUsedPercent, 0, 100);
            meters.dsk = clamp(stats.cpuPercent * 0.7 + stats.memUsedPercent * 0.3, 10, 95);
            meters.uptime = formatUptime(stats.uptimeSec || uptimeSec);
            paintMeters();
          })
          .catch(() => {
            paintMeters();
          });
      }

      tick();
      setInterval(tick, 2000);

      function applyTheme(dark) {
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      }

      if (window.hl) {
        window.hl.ready()
          .then(() => window.hl.getContext())
          .then(ctx => { if (ctx && typeof ctx.dark === 'boolean') applyTheme(ctx.dark); })
          .catch(() => {});
        window.hl.onTheme(state => {
          if (state && typeof state.dark === 'boolean') applyTheme(state.dark);
        });
      }
    })();
  </script>
</body>
</html>
