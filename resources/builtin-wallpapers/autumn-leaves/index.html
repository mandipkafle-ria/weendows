<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autumn Leaves</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
  }
  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #1a0a00 0%, #0a0500 100%);
  }

  /* Subtle warm ground glow */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 25%;
    background: linear-gradient(to top, rgba(100, 40, 0, 0.25) 0%, transparent 100%);
  }

  /* Each leaf is an SVG rendered via canvas-free method */
  .leaf {
    position: absolute;
    top: -80px;
    opacity: 0;
    will-change: transform, opacity;
    animation: fall linear infinite;
    transform-origin: center;
  }
  .leaf svg {
    display: block;
  }

  @keyframes fall {
    0% {
      opacity: 0;
      top: -80px;
      transform: translateX(0px) rotate(0deg);
    }
    5%  { opacity: 0.85; }
    93% { opacity: 0.7; }
    100% {
      opacity: 0;
      top: 108vh;
      transform: translateX(var(--sway)) rotate(var(--spin));
    }
  }
</style>
</head>
<body>
<div class="ground"></div>
<div id="scene"></div>

<script>
// Leaf SVG shapes (self-contained, no external resources)
const LEAF_SHAPES = [
  // Maple-style
  `<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
    <path d="M22 2 C18 8 10 6 8 12 C12 12 14 14 12 18 C8 16 4 18 2 22
             C6 22 8 26 6 30 C10 28 14 30 16 36 C18 32 20 32 22 38
             C24 32 26 32 28 36 C30 30 34 28 38 30 C36 26 38 22 42 22
             C40 18 36 16 32 18 C30 14 32 12 36 12 C34 6 26 8 22 2Z"
          fill="VAR_COLOR" opacity="0.9"/>
    <line x1="22" y1="38" x2="22" y2="8" stroke="rgba(0,0,0,0.2)" stroke-width="0.8"/>
  </svg>`,
  // Oak-style
  `<svg width="50" height="46" viewBox="0 0 50 46" xmlns="http://www.w3.org/2000/svg">
    <path d="M25 4 C22 10 16 8 14 14 C10 12 6 16 8 20 C4 20 2 24 6 26
             C4 30 8 34 12 32 C14 36 18 38 22 36 C22 40 24 44 25 44
             C26 44 28 40 28 36 C32 38 36 36 38 32 C42 34 46 30 44 26
             C48 24 46 20 42 20 C44 16 40 12 36 14 C34 8 28 10 25 4Z"
          fill="VAR_COLOR" opacity="0.88"/>
    <line x1="25" y1="42" x2="25" y2="6" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>
  </svg>`,
  // Simple oval leaf
  `<svg width="36" height="54" viewBox="0 0 36 54" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 2 C28 8 32 20 30 34 C28 44 24 50 18 52 C12 50 8 44 6 34
             C4 20 8 8 18 2Z"
          fill="VAR_COLOR" opacity="0.85"/>
    <line x1="18" y1="52" x2="18" y2="4" stroke="rgba(0,0,0,0.18)" stroke-width="0.9"/>
    <path d="M18 20 C12 24 8 30 8 36" stroke="rgba(0,0,0,0.1)" stroke-width="0.6" fill="none"/>
    <path d="M18 20 C24 24 28 30 28 36" stroke="rgba(0,0,0,0.1)" stroke-width="0.6" fill="none"/>
  </svg>`,
  // Ginkgo-fan
  `<svg width="52" height="42" viewBox="0 0 52 42" xmlns="http://www.w3.org/2000/svg">
    <path d="M26 40 C26 40 8 30 4 18 C2 10 8 2 16 4 C20 5 22 10 22 14
             C20 8 22 2 26 2 C30 2 32 8 30 14 C30 10 32 5 36 4
             C44 2 50 10 48 18 C44 30 26 40 26 40Z"
          fill="VAR_COLOR" opacity="0.87"/>
    <line x1="26" y1="40" x2="26" y2="14" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>
  </svg>`,
];

const COLORS = [
  '#c0392b', '#e74c3c', '#e67e22', '#d35400',
  '#f39c12', '#f1c40f', '#8B4513', '#a0522d',
  '#8e6b3e', '#b8860b', '#cd853f', '#7b241c',
];

const scene = document.getElementById('scene');
const NUM_LEAVES = 38;

for (let i = 0; i < NUM_LEAVES; i++) {
  const el = document.createElement('div');
  el.className = 'leaf';

  const shape = LEAF_SHAPES[Math.floor(Math.random() * LEAF_SHAPES.length)];
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  el.innerHTML = shape.replace('VAR_COLOR', color);

  const scale = 0.55 + Math.random() * 0.75;
  const sway = (Math.random() - 0.5) * 340;
  const spin = (Math.random() - 0.5) * 720;
  const duration = 8 + Math.random() * 12;
  const delay = Math.random() * -22;

  el.style.cssText = [
    `left: ${Math.random() * 105 - 2}vw`,
    `--sway: ${sway}px`,
    `--spin: ${spin}deg`,
    `animation-duration: ${duration}s`,
    `animation-delay: ${delay}s`,
    `transform: scale(${scale})`,
    `filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4))`,
  ].join(';');

  scene.appendChild(el);
}
</script>
</body>
</html>
